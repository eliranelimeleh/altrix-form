<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ניהול אישי</title>
<!-- אבטחה: הדף לא טוען ולא שולח שום דבר לאינטרנט -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<style>
:root{
  color-scheme:light;
  --bg:#f4f6f9; --surface:#fff; --surface-2:#f8f9fb; --surface-3:#eef1f5;
  --border:#e2e6ec; --border-soft:#edf0f4;
  --text:#111827; --text-2:#4b5563; --muted:#8b94a3;
  --accent:#2a78d6; --accent-soft:#e8f1fc;
  --inc:#1baf7a; --exp:#eb6834;
  --pos:#0b7a3e; --neg:#c62f2f; --pos-soft:#e6f5ec; --neg-soft:#fdeceb;
  --grid:#e9ecf1; --axis:#c8ced8;
  --c0:#2a78d6; --c1:#eb6834; --c2:#1baf7a; --c3:#eda100; --c4:#e87ba4; --c5:#008300; --c6:#6250d6; --c7:#e34948;
  --shadow:0 1px 2px rgba(17,24,39,.04),0 2px 10px rgba(17,24,39,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d1015; --surface:#161a21; --surface-2:#1b2028; --surface-3:#232933;
    --border:#2a313c; --border-soft:#20262f;
    --text:#eef1f5; --text-2:#b6bdca; --muted:#7e8796;
    --accent:#3987e5; --accent-soft:#17263b;
    --inc:#199e70; --exp:#d95926;
    --pos:#3fcf7e; --neg:#ff7676; --pos-soft:#12291c; --neg-soft:#2f1718;
    --grid:#232a34; --axis:#3a4352;
    --c0:#3987e5; --c1:#d95926; --c2:#199e70; --c3:#c98500; --c4:#d55181; --c5:#008300; --c6:#9085e9; --c7:#e66767;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d1015; --surface:#161a21; --surface-2:#1b2028; --surface-3:#232933;
  --border:#2a313c; --border-soft:#20262f;
  --text:#eef1f5; --text-2:#b6bdca; --muted:#7e8796;
  --accent:#3987e5; --accent-soft:#17263b;
  --inc:#199e70; --exp:#d95926;
  --pos:#3fcf7e; --neg:#ff7676; --pos-soft:#12291c; --neg-soft:#2f1718;
  --grid:#232a34; --axis:#3a4352;
  --c0:#3987e5; --c1:#d95926; --c2:#199e70; --c3:#c98500; --c4:#d55181; --c5:#008300; --c6:#9085e9; --c7:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Heebo','Segoe UI',system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;white-space:nowrap}
.ico{flex:none;vertical-align:middle}
.muted{color:var(--muted)} .pos{color:var(--pos)} .neg{color:var(--neg)}
.sp{flex:1}
h1,h2,h3{margin:0}

/* header */
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border)}
.top-in{max-width:1500px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.brand i{font-style:normal;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:#fff}
.tabs{display:flex;gap:4px;background:var(--surface-3);padding:4px;border-radius:12px}
.tabs button{border:0;background:transparent;padding:7px 16px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--text-2);display:flex;gap:6px;align-items:center}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.period{display:flex;align-items:center;gap:2px;border:1px solid var(--border);border-radius:11px;padding:2px;background:var(--surface)}
.period button{border:0;background:transparent;width:32px;height:32px;border-radius:8px;cursor:pointer;display:grid;place-items:center;color:var(--text-2)}
.period button:hover{background:var(--surface-3)}
.period select{border:0;background:transparent;font-weight:700;font-size:15px;padding:4px;cursor:pointer;outline:none}
.period select option{background:var(--surface);color:var(--text)}
.wrap{max-width:1500px;margin:0 auto;padding:20px 24px 60px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:7px 13px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-3)}
.btn.danger{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 35%,transparent);background:transparent}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:8px}
.ib{border:0;background:transparent;width:28px;height:28px;border-radius:7px;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted)}
.ib:hover{background:var(--surface-3);color:var(--text)}
.ib.del:hover{color:var(--neg);background:var(--neg-soft)}
.ib:disabled{opacity:.3;cursor:default}

/* summary strip */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi small{display:flex;align-items:center;gap:6px;color:var(--text-2);font-size:13px;font-weight:500}
.kpi small i{width:9px;height:9px;border-radius:3px;display:inline-block}
.kpi b{display:block;font-size:24px;font-weight:800;margin-top:6px;letter-spacing:-.3px}
.kpi span.f{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:3px;border-radius:99px;padding:0 7px;font-size:11.5px;font-weight:600;line-height:19px;white-space:nowrap}
.chip.good{background:var(--pos-soft);color:var(--pos)} .chip.bad{background:var(--neg-soft);color:var(--neg)} .chip.n{background:var(--surface-3);color:var(--text-2)}

/* sheets */
.sheets{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.sheet{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.sheet-h{display:flex;align-items:center;gap:12px;padding:16px 18px;background:color-mix(in srgb,var(--sc) 13%,var(--surface));border-bottom:3px solid var(--sc)}
.sheet-h h2{font-size:19px;font-weight:800;display:flex;align-items:center;gap:10px}
.sheet-h h2 i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--sc);color:#fff;font-style:normal}
.sheet-h .tot{text-align:left;line-height:1.15}
.sheet-h .tot small{display:block;font-size:11.5px;font-weight:600;color:var(--text-2)}
.sheet-h .tot b{font-size:23px;font-weight:800}
.sheet-gap{height:10px;background:var(--surface-2);border-bottom:1px solid var(--border)}
.sheet.exp{--sc:var(--exp)} .sheet.inc{--sc:var(--inc)} .sheet.owe{--sc:var(--c6)}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
tr.paid td{opacity:.55} tr.paid input.cell{text-decoration:line-through}
input.chk{width:17px;height:17px;accent-color:var(--pos);cursor:pointer;vertical-align:middle}
table.t{width:100%;border-collapse:collapse}
table.t td{padding:0 8px;height:38px;border-bottom:1px solid var(--border-soft);vertical-align:middle}
table.t col.c-kind{width:96px} table.t col.c-amt{width:126px} table.t col.c-act{width:118px}
table.t tr.gh td{background:color-mix(in srgb,var(--g) 9%,var(--surface));border-bottom:1px solid color-mix(in srgb,var(--g) 22%,var(--border));height:42px;cursor:pointer;user-select:none}
table.t tr.gh td:first-child{box-shadow:inset -4px 0 0 var(--g)}
.gname{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px}
.gname .car{transition:transform .15s;color:var(--muted);display:inline-flex}
.collapsed .gname .car{transform:rotate(90deg)}
.gname small{font-weight:500;color:var(--muted);font-size:12px}
.gsum{font-weight:800;text-align:left}
.gsum small{display:block;font-weight:500;font-size:11px;color:var(--muted);line-height:1.1}
tr.it td:first-child{padding-right:18px}
tr.it:hover td{background:var(--surface-2)}
.acts{display:flex;gap:0;justify-content:flex-end;opacity:.35;transition:opacity .15s}
tr.it:hover .acts,tr.gh:hover .acts,tr.it:focus-within .acts{opacity:1}
input.cell{width:100%;border:1px solid transparent;background:transparent;border-radius:7px;padding:5px 7px;outline:none;transition:border .12s,background .12s}
input.cell:hover{border-color:var(--border)}
input.cell:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
input.amt{text-align:left;direction:ltr;font-weight:600;font-variant-numeric:tabular-nums}
input.amt.est{color:var(--muted);font-style:italic;font-weight:500}
input.cell::placeholder{color:var(--axis);font-weight:400;font-style:normal}
.kind{font-size:11px;font-weight:600;border-radius:6px;padding:1px 7px;white-space:nowrap;cursor:pointer;border:0;display:inline-flex;gap:3px;align-items:center;line-height:18px}
.kind.fixed{background:var(--accent-soft);color:var(--accent)}
.kind.variable{background:color-mix(in srgb,var(--c3) 16%,transparent);color:color-mix(in srgb,var(--c3) 65%,var(--text))}
.kind.once{background:var(--surface-3);color:var(--text-2)}
tr.add td{height:36px}
tr.add input.cell{color:var(--text-2)}
tr.add select{border:1px solid var(--border);background:var(--surface-2);border-radius:7px;font-size:12px;padding:3px 4px;width:100%}
tr.add .ok{color:var(--accent)}
tfoot td{font-weight:800;font-size:15px;background:var(--surface-2);height:46px}
.add-group{display:flex;justify-content:center;padding:10px}

/* panels & charts */
.row{display:grid;gap:18px;margin-top:18px}
.r3{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr)}
.r2{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ph h3{font-size:15.5px;font-weight:700}
.ph .sub{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.legend i.ln{height:0;border-top:2px solid var(--accent);border-radius:0;width:16px;vertical-align:3px}
.legend i.ds{height:0;border-top:2px dashed var(--accent);border-radius:0;width:16px;vertical-align:3px}
.chart{width:100%;position:relative}
.chart svg{display:block;direction:ltr;overflow:visible}
.chart .gl{stroke:var(--grid)} .chart .base{stroke:var(--axis)}
.chart .ax{fill:var(--muted);font-size:11px}
.chart .ax.on{fill:var(--text);font-weight:700}
.chart .band{fill:var(--text);opacity:0} .chart .band.on{opacity:.05} .chart .band.sel{opacity:.07;fill:var(--accent)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .xh{stroke:var(--text-2);opacity:0} .chart .xh.on{opacity:.4}
.chart .hd{opacity:0} .chart .hd.on{opacity:1}
.chart .seg{cursor:pointer;transition:opacity .12s}
.chart svg:hover .seg{opacity:.55} .chart svg .seg:hover{opacity:1}
.donut-wrap{display:flex;gap:16px;align-items:center}
.donut-wrap .chart{width:176px;flex:none}
.glist{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.gl-row{display:flex;align-items:center;gap:8px;font-size:13px}
.gl-row i{width:10px;height:10px;border-radius:3px;flex:none}
.gl-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl-row .pc{color:var(--muted);font-size:12px;width:38px;text-align:left}
.gl-row b{font-weight:700}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-h{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:5px}
.bar-h .nm{display:flex;gap:6px;align-items:center;min-width:0;flex:1}
.track{height:8px;border-radius:99px;background:var(--surface-3);display:flex;overflow:hidden;gap:2px}
.track div{height:100%;border-radius:99px;min-width:2px}
#tip{position:fixed;z-index:80;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:9px 11px;box-shadow:0 10px 30px rgba(0,0,0,.18);font-size:12.5px;min-width:150px;opacity:0;transition:opacity .1s}
#tip.on{opacity:1}
#tip .tt{font-weight:700;margin-bottom:5px}
#tip .tr{display:flex;gap:10px;justify-content:space-between;margin-top:3px}
#tip .tr span{color:var(--text-2);display:flex;gap:6px;align-items:center}
#tip .sw{width:9px;height:9px;border-radius:3px;display:inline-block}
#tip hr{border:0;border-top:1px solid var(--border);margin:5px 0}

/* year sheet */
.ysheet{overflow-x:auto;border-radius:16px}
table.y{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.y th,table.y td{border-bottom:1px solid var(--border-soft);padding:0 3px;height:34px;white-space:nowrap}
table.y th{background:var(--surface);font-size:12px;color:var(--text-2);font-weight:600;height:42px}
table.y th.fut{color:var(--muted)} table.y th.now{color:var(--accent)}
table.y .nm{position:sticky;right:0;background:var(--surface);z-index:1;min-width:180px;max-width:230px;overflow:hidden;text-overflow:ellipsis;padding-right:12px;border-left:1px solid var(--border-soft);text-align:right}
table.y td.fut{background:color-mix(in srgb,var(--surface-3) 50%,transparent)}
table.y td.now{background:color-mix(in srgb,var(--accent) 6%,transparent)}
table.y input.amt{min-width:66px;padding:4px 5px;font-size:12.5px}
table.y td.tot{font-weight:700;text-align:left;padding:0 10px;min-width:90px}
table.y tr.gh td.nm{background:color-mix(in srgb,var(--g) 10%,var(--surface));box-shadow:inset -4px 0 0 var(--g)}
table.y tr.gh td{background:color-mix(in srgb,var(--g) 5%,var(--surface))}
table.y tr.gh td.v{text-align:left;font-weight:700;padding:0 8px;font-size:12.5px}
table.y tr.sec td{background:var(--surface-3);font-weight:800;font-size:14px;height:40px}
table.y tr.sum td{font-weight:800;text-align:left;padding:0 8px;background:var(--surface-2)}
table.y tr.sum td.nm{text-align:right;background:var(--surface-2)}
.hint{font-size:12px;color:var(--muted)}

/* modal / toast */
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
#modal.open{display:flex}
.mbg{position:absolute;inset:0;background:rgba(10,14,22,.5);backdrop-filter:blur(2px)}
.modal{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:18px;width:min(520px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal header{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal header h3{font-size:16.5px}
.modal header .ib{margin-inline-start:auto}
.mb{padding:16px 18px;overflow-y:auto}
.modal footer{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--border);flex-wrap:wrap}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;color:var(--text-2);font-weight:500}
.inp{width:100%;border:1px solid var(--border);background:var(--surface-2);border-radius:9px;padding:8px 11px;outline:none}
.inp:focus{border-color:var(--accent);background:var(--surface)}
.seg{display:flex;background:var(--surface-3);border-radius:10px;padding:3px;gap:3px}
.seg label{flex:1;text-align:center;padding:7px 4px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--text-2);font-size:13px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{width:30px;height:30px;border-radius:9px;cursor:pointer}
.swatches input{position:absolute;opacity:0}
.swatches label:has(input:checked){outline:2px solid var(--text);outline-offset:2px}
.choice{display:flex;flex-direction:column;gap:10px}
.choice button{text-align:start;border:1px solid var(--border);background:var(--surface-2);border-radius:12px;padding:12px 14px;cursor:pointer}
.choice button:hover{border-color:var(--accent);background:var(--accent-soft)}
.choice button b{display:block;font-size:14.5px}
.choice button span{font-size:12.5px;color:var(--text-2)}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,16px);background:#111827;color:#fff;padding:9px 15px;border-radius:11px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .2s;z-index:90}
#toast.on{opacity:1;transform:translate(-50%,0)}
.banner{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:12px;background:color-mix(in srgb,var(--c3) 14%,var(--surface));color:color-mix(in srgb,var(--c3) 55%,var(--text));font-size:13px;margin-bottom:16px;flex-wrap:wrap}
.banner .btn{margin-inline-start:auto}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar h1{font-size:22px;font-weight:800}
.toolbar .sub{color:var(--muted);font-size:13px}

/* tasks */
.tabs.sm{padding:3px} .tabs.sm button{padding:5px 12px;font-size:13px}
.qadd{display:flex;gap:8px;align-items:center;padding:10px;margin-bottom:14px;flex-wrap:wrap}
.qadd [data-qa=title]{flex:1;min-width:200px}
.qadd select,.qadd input[type=date],.qadd input[type=time]{width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text-2)}
.chips button.on{background:var(--text);color:var(--surface);border-color:var(--text)}
.chips button small{opacity:.7}
.tsearch{position:relative;min-width:180px}
.tsearch .ico{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.tsearch input{padding-right:32px}
.check{display:flex;gap:6px;align-items:center;cursor:pointer;font-size:13px;color:var(--text-2)}
.sheet.tasks col:first-child{width:58px} .sheet.tasks col.w-date{width:142px} .sheet.tasks col.w-time{width:96px} .sheet.tasks col.w-prio{width:70px}
.tt-wrap{display:flex;align-items:center;gap:4px}
.tmeta{display:flex;gap:10px;font-size:11.5px;color:var(--muted);padding:0 8px 4px;margin-top:-4px}
.tmeta span{display:inline-flex;gap:4px;align-items:center}
.tmeta i{width:8px;height:8px;border-radius:3px;display:inline-block}
input.dt{font-size:12.5px;color:var(--text-2)} input.dt.over{color:var(--neg);font-weight:600}
input[type=time].cell{font-size:12.5px;color:var(--text-2)}
.pdot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.pdot.p1{background:var(--c3)} .pdot.p2{background:var(--neg)}
.prio{border:0;border-radius:6px;font-size:11px;font-weight:600;padding:2px 8px;cursor:pointer;background:var(--surface-3);color:var(--muted)}
.prio.p1{background:color-mix(in srgb,var(--c3) 18%,transparent);color:color-mix(in srgb,var(--c3) 60%,var(--text))}
.prio.p2{background:var(--neg-soft);color:var(--neg)}
tr.task td{height:auto;padding-top:4px;padding-bottom:4px}
tr.gh.nohand td{cursor:default}
.mini{display:inline-flex;width:70px;height:5px;border-radius:9px;background:color-mix(in srgb,var(--g) 18%,transparent);overflow:hidden;margin-inline-start:6px}
.mini span{background:var(--g);height:100%}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}

let CD = null, calSwallow = false;

function calTarget(x, y) {

  const col = el.closest('.cal-col');
  if (col) { const top = col.getBoundingClientRect().top; let m = CAL_S * 60 + snap((y - top - CD.grab) / HPX * 60); m = Math.max(CAL_S * 60, Math.min(1440 - Math.min(dur, 60), m)); return {date: col.dataset.cdate, time: fromMin(m), col, m, dur}; }

document.addEventListener('pointermove', e => {
  if (!CD) return;

    if (CD.mode === 'new' || CD.mode === 'newday') { CD = null; return; }   // גלילה רגילה
    CD.started = true; CD.el.classList.add('dragging'); document.body.classList.add('dnd');
    if (CD.mode === 'move') { CD.ghost = Object.assign(document.createElement('div'), {className: 'dnd-ghost', textContent: taskById(CD.id).title}); document.body.appendChild(CD.ghost); }
  }

    const t = taskById(CD.id), top = CD.el.getBoundingClientRect().top, d = Math.max(15, snap((e.clientY - top) / HPX * 60));
    CD.dur = Math.min(d, 1440 - toMin(t.time)); CD.el.style.height = (CD.dur / 60 * HPX - 2) + 'px';
    CD.el.querySelector('.cb-t span').textContent = `${t.time}–${fromMin(Math.min(1439, toMin(t.time) + CD.dur))}`;

  }

  CD.tg = calTarget(e.clientX, e.clientY); calShowPrev(CD.tg);

  clearInterval(CD.scr);

document.addEventListener('pointerup', e => {

    if (c.mode === 'new') { const top = c.col.getBoundingClientRect().top, m = Math.max(CAL_S * 60, Math.min(1410, CAL_S * 60 + Math.floor((e.clientY - top) / HPX * 2) * 30)); return taskForm(null, {date: c.col.dataset.cdate, time: fromMin(m), dur: 60}); }

function setCell(itemId, ym, raw) {

  const k = itemId + '|' + ym, v = parseNum(raw), curV = cellVal(it, ym);
  if (it.kind === 'fixed' && inRange(it, ym) && !(k in db.values)) {
    const nv = v ?? 0;

}

    body: `<p style="margin:0 0 12px;color:var(--text-2)">הסכום משתנה מ-${plain(planAt(it, ym))} ל-<b>${plain(v)}</b>. על אילו חודשים להחיל?</p>
      <div class="choice"><button type="button" data-scope="one"><b>רק ב${MONTHS[ymM(ym)]} ${ymY(ym)}</b><span>שינוי חד־פעמי, בשאר החודשים נשאר ${plain(planAt(it, later))}</span></button>

}
function quickAdd(gid) {

/* ---------- events ---------- */

document.addEventListener('input', e => { if (e.target.dataset.tsearch != null) { ui.tq = e.target.value; render(); } if (e.target.dataset.vsearch != null) { ui.vq = e.target.value; render(); } });

});
document.addEventListener('keydown', e => {
  if ($('#modal').classList.contains('open')) { if (e.key === 'Escape') { const cb = onModalClose; closeModal(); cb && cb(); } return; }
  const el = e.target; if (!el.dataset?.k) return;
  const list = $$('input[data-k],select[data-k]').filter(x => x.offsetParent);
  if (e.key === 'Enter') {
    e.preventDefault();
    const addG = el.dataset.add || el.dataset.addv || el.dataset.addkind;
    if (addG) return quickAdd(addG);
    if (el.dataset.oweadd) return addOwed();
    if (el.dataset.vadd) return ACTIONS.vAddRow(el.dataset.vadd);
    if (el.dataset.qa) return ACTIONS.qaAdd();
    const tc = el.dataset.tadd || el.dataset.taddd || el.dataset.taddt; if (tc) return ACTIONS.taskQuickAdd(tc);
    if (el.dataset.wadd) { const title = el.value.trim(); if (!title) return; addTask({title, catId: ui.tLastCat || db.taskCats[0].id, date: el.dataset.wadd}); pendingFocus = 'wadd|' + el.dataset.wadd; save('✓ נוספה'); return render(); }

    if (nx) { pendingFocus = nx.dataset.k; nx.focus(); } else el.blur();
    setTimeout(() => pendingFocus = null);
  } else if (e.key === 'Tab') {
    const nx = list[list.indexOf(el) + (e.shiftKey ? -1 : 1)]; if (nx) pendingFocus = nx.dataset.k;
    setTimeout(() => pendingFocus = null);
