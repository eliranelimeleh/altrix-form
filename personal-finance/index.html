<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>ניהול פיננסי אישי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f7f8fb; --surface-3:#eef1f6;
  --border:#e3e7ee; --border-soft:#eef1f5;
  --text:#0f172a; --text-2:#475569; --muted:#8a94a6;
  --accent:#2a78d6; --accent-2:#1c5cab; --accent-soft:#e7f0fc;
  --income:#1baf7a; --expense:#eb6834;
  --pos:#0b7a3e; --neg:#c62f2f; --warn:#a86b00;
  --pos-soft:#e5f5ec; --neg-soft:#fdeaea; --warn-soft:#fff4dc;
  --grid:#e8ebf0; --axis:#c9cfd8;
  --side:#0f172a; --side-2:#1e293b; --side-text:#cbd5e1;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.05);
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0c0f14; --surface:#151920; --surface-2:#1a1f27; --surface-3:#222833;
    --border:#272e3a; --border-soft:#1f2530;
    --text:#eef1f5; --text-2:#b4bccb; --muted:#7d8697;
    --accent:#3987e5; --accent-2:#6da7ec; --accent-soft:#16263d;
    --income:#199e70; --expense:#d95926;
    --pos:#3fcf7e; --neg:#ff7373; --warn:#f2b84b;
    --pos-soft:#11291c; --neg-soft:#2e1617; --warn-soft:#2c2412;
    --grid:#232a35; --axis:#3a4352;
    --side:#090c11; --side-2:#151a22; --side-text:#b4bccb;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c0f14; --surface:#151920; --surface-2:#1a1f27; --surface-3:#222833;
  --border:#272e3a; --border-soft:#1f2530;
  --text:#eef1f5; --text-2:#b4bccb; --muted:#7d8697;
  --accent:#3987e5; --accent-2:#6da7ec; --accent-soft:#16263d;
  --income:#199e70; --expense:#d95926;
  --pos:#3fcf7e; --neg:#ff7373; --warn:#f2b84b;
  --pos-soft:#11291c; --neg-soft:#2e1617; --warn-soft:#2c2412;
  --grid:#232a35; --axis:#3a4352;
  --side:#090c11; --side-2:#151a22; --side-text:#b4bccb;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;white-space:nowrap}
.ico{flex:none;vertical-align:middle}
.muted{color:var(--muted)} .t2{color:var(--text-2)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
.sp{flex:1}
h1,h2,h3,h4{margin:0;font-weight:700}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-text);padding:22px 14px 16px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:4px 10px 22px}
.brand-logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#2a78d6,#1baf7a);display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(42,120,214,.35)}
.brand b{display:block;color:#fff;font-size:16px;font-weight:700}
.brand span{font-size:12px;color:#8a94a6}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;background:transparent;color:var(--side-text);border-radius:10px;cursor:pointer;text-align:start;font-size:14px;transition:background .15s,color .15s}
.nav-btn:hover{background:var(--side-2);color:#fff}
.nav-btn.active{background:linear-gradient(90deg,rgba(42,120,214,.0),rgba(42,120,214,.28));color:#fff;box-shadow:inset -3px 0 0 #3987e5}
.nav-btn .badge{margin-inline-start:auto;background:#d03b3b;color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid rgba(255,255,255,.07);font-size:12px;color:#8a94a6;display:flex;flex-direction:column;gap:8px}
.side-foot .lock{display:flex;gap:8px;align-items:flex-start;line-height:1.45}
.side-foot button{background:var(--side-2);border:1px solid rgba(255,255,255,.08);color:#e2e8f0;border-radius:9px;padding:8px 10px;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px}
.side-foot button:hover{background:#26324a}

main{min-width:0;padding:22px 28px 40px}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.topbar h1{font-size:24px;font-weight:800;letter-spacing:-.2px}
.topbar .sub{color:var(--text-2);font-size:13px}
.period{display:flex;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:3px;box-shadow:var(--shadow)}
.period button{border:0;background:transparent;width:34px;height:34px;border-radius:9px;cursor:pointer;display:grid;place-items:center;color:var(--text-2)}
.period button:hover{background:var(--surface-3);color:var(--text)}
.period select{border:0;background:transparent;font-weight:600;padding:6px 4px;cursor:pointer;outline:none}
.period select option{background:var(--surface);color:var(--text)}

/* ---------- Buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:11px;padding:9px 15px;cursor:pointer;font-weight:500;white-space:nowrap;transition:transform .1s,background .15s,box-shadow .15s}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(42,120,214,.28)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-3);color:var(--text)}
.btn.danger{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 35%,transparent);background:transparent}
.btn.danger:hover{background:var(--neg-soft)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:9px}
.icon-btn{border:0;background:transparent;width:32px;height:32px;border-radius:9px;display:inline-grid;place-items:center;cursor:pointer;color:var(--text-2)}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}
.icon-btn.del:hover{color:var(--neg);background:var(--neg-soft)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;color:var(--text-2);font-weight:500}
.input,select.input,textarea.input{width:100%;border:1px solid var(--border);background:var(--surface-2);border-radius:10px;padding:9px 12px;outline:none;transition:border .15s,box-shadow .15s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent);background:var(--surface)}
.input.sm{padding:6px 9px;font-size:13px}
input.amount{font-size:22px;font-weight:700;direction:ltr;text-align:right}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.seg{display:flex;background:var(--surface-3);border-radius:11px;padding:3px;gap:3px}
.seg label{flex:1;text-align:center;padding:8px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--text-2);display:flex;align-items:center;justify-content:center;gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:var(--text)}
.seg label:has(input:checked){background:var(--surface);box-shadow:var(--shadow);color:var(--text)}
.seg label.exp:has(input:checked){color:var(--expense)}
.seg label.inc:has(input:checked){color:var(--income)}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.hint{font-size:12px;color:var(--muted)}

/* ---------- Panels & grids ---------- */
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.kpis.k6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:1500px){.kpis.k6{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cols-2{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.cols-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 18px 16px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.panel-h h3{font-size:15.5px;font-weight:700}
.panel-h .sub{font-size:12.5px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.legend i.dash{height:0;border-top:2px dashed var(--accent);border-radius:0;width:16px;vertical-align:3px}
.legend i.line{height:0;border-top:2px solid var(--accent);border-radius:0;width:16px;vertical-align:3px}

.kpi{position:relative;overflow:hidden}
.kpi .k-top{display:flex;align-items:center;gap:10px;color:var(--text-2);font-size:13px;font-weight:500}
.kpi .k-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.kpi .k-ico.inc{background:color-mix(in srgb,var(--income) 14%,transparent);color:var(--income)}
.kpi .k-ico.exp{background:color-mix(in srgb,var(--expense) 14%,transparent);color:var(--expense)}
.kpi .k-val{font-size:26px;font-weight:800;margin:12px 0 4px;letter-spacing:-.4px}
.kpi .k-foot{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:3px;border-radius:99px;padding:1px 8px;font-size:12px;font-weight:600}
.chip.good{background:var(--pos-soft);color:var(--pos)}
.chip.bad{background:var(--neg-soft);color:var(--neg)}
.chip.neutral{background:var(--surface-3);color:var(--text-2)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.info{background:var(--accent-soft);color:var(--accent)}

/* ---------- Charts ---------- */
.chart{width:100%;position:relative}
.chart svg{display:block;direction:ltr;overflow:visible}
.chart .grid-l{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--axis)}
.chart .ax{fill:var(--muted);font-size:11px}
.chart .band{fill:var(--text);opacity:0;transition:opacity .12s}
.chart .band.on{opacity:.05}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .xh{stroke:var(--text-2);stroke-width:1;opacity:0}
.chart .xh.on{opacity:.45}
.chart .hdot{opacity:0}
.chart .hdot.on{opacity:1}
#tip{position:fixed;z-index:80;pointer-events:none;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.18);font-size:12.5px;min-width:150px;opacity:0;transform:translateY(4px);transition:opacity .1s,transform .1s}
#tip.on{opacity:1;transform:none}
#tip .tt{font-weight:700;margin-bottom:6px}
#tip .tr{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-top:3px}
#tip .tr span:first-child{color:var(--text-2);display:flex;align-items:center;gap:6px}
#tip .tr b{font-weight:700}
#tip .sw{width:9px;height:9px;border-radius:3px;display:inline-block}
#tip hr{border:0;border-top:1px solid var(--border);margin:6px 0}

/* horizontal category bars */
.hbars{display:flex;flex-direction:column;gap:13px}
.hbar-h{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:6px}
.hbar-h .nm{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-h .vl{margin-inline-start:auto;font-weight:600;display:flex;gap:6px;align-items:baseline}
.hbar-h .vl small{color:var(--muted);font-weight:400}
.track{position:relative;height:8px;background:var(--surface-3);border-radius:99px;overflow:visible;display:flex}
.fill{height:100%;border-radius:99px;background:var(--accent);min-width:3px;transition:width .4s}
.fill.over{background:var(--neg)}
.fill.near{background:var(--warn)}
.fill.inc{background:var(--income)}
.fill.good{background:var(--pos)}
.bmark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);opacity:.55;border-radius:2px;transform:translateX(50%)}
.emo{width:28px;height:28px;border-radius:9px;background:var(--surface-3);display:inline-grid;place-items:center;font-size:15px;flex:none}

/* ---------- Lists & tables ---------- */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--border-soft)}
.li:last-child{border-bottom:0}
.li .main{min-width:0;flex:1}
.li .ttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.li .amt{font-weight:700;text-align:end}
.li.planned{opacity:.92}
.li.planned .ttl::after{content:"צפוי";font-size:10.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;margin-inline-start:8px;vertical-align:1px}
.datebox{width:42px;flex:none;text-align:center;border-radius:10px;background:var(--surface-3);padding:4px 0;line-height:1.15}
.datebox b{display:block;font-size:15px}
.datebox span{font-size:10.5px;color:var(--muted)}
.tbl-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-weight:600;color:var(--text-2);font-size:12px;text-align:start;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface)}
.tbl td{padding:10px;border-bottom:1px solid var(--border-soft);vertical-align:middle}
.tbl tr:hover td{background:var(--surface-2)}
.tbl td.n,.tbl th.n{text-align:end}
.tbl tfoot td{font-weight:700;border-top:1px solid var(--border);border-bottom:0;background:var(--surface-2)}
.tbl tr.sec td{background:var(--surface-2);font-weight:700;color:var(--text-2);font-size:12px}
.tbl tr.total td{font-weight:800}
.tbl .sticky{position:sticky;right:0;background:var(--surface);z-index:1}
.tbl tr:hover .sticky{background:var(--surface-2)}
.tbl.year td{white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tr.dim td{opacity:.72}
.row-actions{display:flex;gap:2px;justify-content:flex-end;opacity:.55;transition:opacity .15s}
tr:hover .row-actions,.li:hover .row-actions{opacity:1}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:7px;background:var(--surface-3);color:var(--text-2);white-space:nowrap}
.tag.card{background:var(--accent-soft);color:var(--accent)}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters .input{width:auto;min-width:130px}
.search{position:relative;flex:1;min-width:180px}
.search .ico{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-right:36px}
.sumbar{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--text-2);margin-bottom:12px}
.sumbar b{color:var(--text)}

/* credit cards */
.cc{border-radius:18px;padding:18px;color:#fff;min-height:170px;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 10px 26px rgba(15,23,42,.18)}
.cc::after{content:"";position:absolute;inset:auto -60px -90px auto;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.cc .cc-top{display:flex;align-items:center;gap:8px}
.cc .cc-name{font-weight:700;font-size:16px}
.cc .cc-num{letter-spacing:2px;opacity:.85;margin-top:auto;font-size:13px}
.cc .cc-amt{font-size:26px;font-weight:800;margin-top:10px}
.cc .cc-sub{font-size:12px;opacity:.82}
.cc .icon-btn{color:#fff}
.cc .icon-btn:hover{background:rgba(255,255,255,.15);color:#fff}
.cc .lim{height:5px;background:rgba(255,255,255,.22);border-radius:9px;margin-top:10px;overflow:hidden}
.cc .lim div{height:100%;background:#fff;border-radius:9px}
.g1{background:linear-gradient(135deg,#1c5cab,#2a78d6 55%,#5598e7)}
.g2{background:linear-gradient(135deg,#0f172a,#334155)}
.g3{background:linear-gradient(135deg,#0e6b4b,#1baf7a)}
.g4{background:linear-gradient(135deg,#4c1d95,#6250d6)}
.g5{background:linear-gradient(135deg,#9a3412,#eb6834)}
.g6{background:linear-gradient(135deg,#831843,#d55181)}

/* debts & goals */
.dcard .dh{display:flex;align-items:flex-start;gap:12px}
.dcard .dh .emo{width:40px;height:40px;font-size:19px;border-radius:12px}
.dstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 12px}
.dstats div{background:var(--surface-2);border-radius:11px;padding:8px 10px}
.dstats small{display:block;font-size:11.5px;color:var(--muted)}
.dstats b{font-size:15px}
.progress{height:10px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.progress>div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--income),color-mix(in srgb,var(--income) 70%,#fff))}
.prog-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}

/* insights */
.ins{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:13.5px;line-height:1.45}
.ins .ii{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none}
.ins.good .ii{background:var(--pos-soft);color:var(--pos)}
.ins.bad .ii{background:var(--neg-soft);color:var(--neg)}
.ins.warn .ii{background:var(--warn-soft);color:var(--warn)}
.ins.info .ii{background:var(--accent-soft);color:var(--accent)}

/* hero / empty */
.hero{background:radial-gradient(1200px 300px at 100% 0%,color-mix(in srgb,var(--accent) 22%,transparent),transparent),var(--surface);border:1px solid var(--border);border-radius:22px;padding:38px 32px;box-shadow:var(--shadow)}
.hero h2{font-size:28px;font-weight:800;margin-bottom:8px}
.hero p{color:var(--text-2);max-width:640px;font-size:15px}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:26px}
.step{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:14px}
.step b{display:block;margin:6px 0 2px}
.step span{font-size:13px;color:var(--text-2)}
.step i{font-style:normal;width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:13px}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty .ico{color:var(--axis);margin-bottom:6px}
.banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13.5px;margin-bottom:16px;flex-wrap:wrap}
.banner .btn{margin-inline-start:auto}

/* ---------- Modal & toast ---------- */
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
#modal.open{display:flex}
.modal-backdrop{position:absolute;inset:0;background:rgba(10,14,22,.55);backdrop-filter:blur(3px)}
.modal{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:20px;width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .16s ease-out}
.modal.wide{width:min(760px,100%)}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.modal header{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal header h3{font-size:17px}
.modal header .icon-btn{margin-inline-start:auto}
.modal-body{padding:18px 20px;overflow-y:auto}
.modal footer{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--border);flex-wrap:wrap}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .2s;z-index:90;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- Mobile ---------- */
.bottomnav{display:none}
.fab{display:none}
@media (max-width:1180px){
  .cols-2,.cols-3{grid-template-columns:minmax(0,1fr)}
}

  .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .filters .search{grid-column:1/-1}
  .filters .input{min-width:0;width:100%}
  .filters .btn.primary{display:none}
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{display:none}
  main{padding:16px 16px 96px}
  .topbar{gap:10px;margin-bottom:16px}
  .topbar h1{font-size:20px}
  .topbar .new-btn{display:none}
  .cols-2e{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi .k-val{font-size:20px}
  .kpi .k-top{font-size:12px}
  .kpi .k-ico{width:28px;height:28px}
  .panel{padding:14px;border-radius:14px}
  .form-grid{grid-template-columns:1fr}
  .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .bottomnav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:4px 6px;border-radius:10px;cursor:pointer;min-width:58px}
  .bottomnav button.active{color:var(--accent)}
  .fab{display:grid;position:fixed;z-index:41;left:18px;bottom:calc(74px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:18px;border:0;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 10px 24px rgba(42,120,214,.45);cursor:pointer}
  .tbl.resp thead{display:none}
  .tbl.resp tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"ic desc amt act" "ic cat amt act";gap:2px 10px;padding:10px 2px;border-bottom:1px solid var(--border-soft);align-items:center}
  .tbl.resp td{border:0;padding:0;background:transparent!important}

  .tbl.resp td.c-act .row-actions{opacity:1}

  .dstats{grid-template-columns:1fr 1fr}
  .hero{padding:26px 20px}

  .modal{border-radius:18px 18px 0 0;align-self:flex-end;max-height:92vh}

}

<body>

  <aside class="sidebar" id="sidebar"></aside>
  <main>
    <div class="topbar" id="topbar"></div>
    <div id="banner"></div>
    <section id="view"></section>
  </main>
</div>
<nav class="bottomnav" id="bottomnav"></nav>

<div id="modal"></div>

<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
'use strict';
/* =====================================================================
   ניהול פיננסי אישי — קובץ יחיד, ללא שרת.
   כל הנתונים נשמרים ב-localStorage של הדפדפן במחשב הזה בלבד.
   ===================================================================== */

const KEY = 'personal-finance-v1';
const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const SHORT = ['ינו׳','פבר׳','מרץ','אפר׳','מאי','יוני','יולי','אוג׳','ספט׳','אוק׳','נוב׳','דצמ׳'];
const DEBT_KINDS = {loan:['הלוואה בנקאית','🏦'],mortgage:['משכנתא','🏠'],overdraft:['מינוס / מסגרת','📉'],card:['הלוואת אשראי','💳'],family:['חוב למשפחה/חברים','🤝'],other:['חוב אחר','📄']};

const I = {
  dash:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  flow:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>',
  bank:'<path d="M3 22h18M6 18v-7M10 18v-7M14 18v-7M18 18v-7M12 2l9 5H3z"/>',
  pie:'<path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/>',
  target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  sliders:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  right:'<path d="m9 18 6-6-6-6"/>', left:'<path d="m15 18-6-6 6-6"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
  alert:'<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/>',
  up:'<path d="M12 19V5M5 12l7-7 7 7"/>', down:'<path d="M12 5v14M19 12l-7 7-7-7"/>',
  wallet:'<path d="M20 12V8H6a2 2 0 0 1 0-4h12v4"/><path d="M4 6v12a2 2 0 0 0 2 2h14v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/>',
  lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
  moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>',
  repeat:'<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
  bulb:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>',
  trendUp:'<path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/>',
  trendDown:'<path d="m22 17-8.5-8.5-5 5L2 7"/><path d="M16 17h6v-6"/>',
  more:'<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  piggy:'<path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.7-1 2-2h2v-4h-2c0-1-.5-1.5-1-2V5z"/><path d="M2 9v1c0 1.1.9 2 2 2h1"/>',
  coins:'<circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18M7 6h1v4M16.71 13.88l.7.71-2.82 2.82"/>',
};
const ico = (n, s = 18) => `<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n] || ''}</svg>`;

/* ---------------- helpers ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const iso = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const ymKey = (y, m) => `${y}-${pad(m + 1)}`;
const daysIn = (y, m) => new Date(y, m + 1, 0).getDate();
const addMonths = (y, m, k) => { const t = y * 12 + m + k; return [Math.floor(t / 12), ((t % 12) + 12) % 12]; };
const NOW = new Date();
const todayISO = () => { const d = new Date(); return iso(d.getFullYear(), d.getMonth(), d.getDate()); };
const curYM = () => ymKey(new Date().getFullYear(), new Date().getMonth());
const monthEnd = (y, m) => iso(y, m, daysIn(y, m));
const parseYM = s => [+s.slice(0, 4), +s.slice(5, 7) - 1];
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum = (arr, f = x => x) => arr.reduce((a, x) => a + (+f(x) || 0), 0);
const nf = new Intl.NumberFormat('he-IL', {maximumFractionDigits: 0});
const nf2 = new Intl.NumberFormat('he-IL', {maximumFractionDigits: 2});
const cur = () => db.settings.currency || '₪';
function money(n, {sign = false, dec = false} = {}) {
  n = +n || 0;
  const a = Math.abs(n), r = dec ? nf2.format(a) : nf.format(Math.round(a));
  const s = (n < -0.004 && Math.round(a) !== 0 || (dec && n < 0) ? '−' : (sign && n > 0.004 ? '+' : '')) + cur() + r;
  return `<span class="num">${s}</span>`;
}
const plain = n => (n < 0 ? '−' : '') + cur() + nf.format(Math.abs(Math.round(n)));
function shortMoney(v) {
  const a = Math.abs(v), s = v < 0 ? '−' : '';
  if (a >= 1e6) return s + (a / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M';
  if (a >= 1e3) return s + (a / 1e3).toFixed(a >= 1e4 ? 0 : 1).replace(/\.0$/, '') + 'K';
  return s + Math.round(a);
}
const pct = (v, d = 0) => `<span class="num">${(v * 100).toFixed(d)}%</span>`;
const fmtDate = s => s ? `${+s.slice(8, 10)}.${+s.slice(5, 7)}.${s.slice(2, 4)}` : '';
const monthLabel = (y, m) => `${MONTHS[m]} ${y}`;

/* ---------------- data ---------------- */
function defaultCategories() {
  const E = (id, icon, name, extra = {}) => ({id, icon, name, type: 'expense', budget: 0, ...extra});
  const N = (id, icon, name) => ({id, icon, name, type: 'income'});
  return [
    E('c-housing','🏠','דיור — שכירות / משכנתא'), E('c-bills','💡','חשבונות הבית (חשמל, מים, ארנונה, גז)'),
    E('c-food','🛒','סופר ומזון'), E('c-rest','🍽️','מסעדות ואוכל בחוץ'), E('c-car','🚗','רכב ותחבורה'),
    E('c-fuel','⛽','דלק'), E('c-comm','📱','תקשורת ואינטרנט'), E('c-ins','🛡️','ביטוחים'),
    E('c-health','💊','בריאות'), E('c-kids','🎓','חינוך וילדים'), E('c-cloth','👕','ביגוד והנעלה'),
    E('c-home','🛋️','ציוד ותחזוקת הבית'), E('c-fun','🎉','פנאי ובילויים'), E('c-subs','🔁','מנויים'),
    E('c-gifts','🎁','מתנות ואירועים'), E('c-care','💇','טיפוח'), E('c-travel','✈️','חופשות'),
    E('c-fees','🏦','עמלות וריביות'), E('c-debt','💳','החזר חובות והלוואות',{kind:'debt'}),
    E('c-saving','🐷','חיסכון והשקעות',{kind:'saving'}), E('c-other','📦','שונות'),
    N('i-salary','💼','משכורת'), N('i-biz','🧾','הכנסה מעסק / פרילנס'), N('i-refund','↩️','החזרים וזיכויים'),
    N('i-gift','🎁','מתנות'), N('i-passive','📈','הכנסה פסיבית'), N('i-other','➕','הכנסה אחרת'),
  ];
}
function defaultDB() {
  const d = new Date();
  return {
    version: 1,
    settings: {currency: '₪', openingBalance: 0, openingDate: iso(d.getFullYear(), d.getMonth(), 1), theme: 'auto', lastBackup: null},
    categories: defaultCategories(), cards: [], debts: [], recurring: [], goals: [], tx: [],
  };
}
let storageOK = true;
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return migrate(JSON.parse(raw));
  } catch (e) { storageOK = false; }
  return defaultDB();
}
function migrate(d) {
  const def = defaultDB();
  for (const k of Object.keys(def)) if (d[k] == null) d[k] = def[k];
  d.settings = {...def.settings, ...d.settings};
  return d;
}
function save(msg) {
  EV = null;
  try { localStorage.setItem(KEY, JSON.stringify(db)); storageOK = true; }
  catch (e) { storageOK = false; toast('⚠️ השמירה בדפדפן נכשלה — כדאי לייצא גיבוי עכשיו'); return; }
  if (msg) toast(msg);
}
let db = load();
const ui = {view: 'overview', y: NOW.getFullYear(), m: NOW.getMonth(), f: {scope: 'month', q: '', type: '', cat: '', method: ''}};
try { const v = sessionStorage.getItem('pf-view'); if (v) ui.view = v; } catch (e) {}

const catById = id => db.categories.find(c => c.id === id) || {id, icon: '❔', name: 'ללא קטגוריה', type: 'expense'};
const cardById = id => db.cards.find(c => c.id === id);
const isCard = m => !!cardById(m);
function methodName(m, short = false) {
  if (m === 'bank') return short ? 'עו״ש' : 'עו״ש (העברה / הו״ק)';
  if (m === 'cash') return 'מזומן';
  const c = cardById(m);
  return c ? `${c.name} ••${c.last4 || ''}` : '—';
}
function methodOptions(sel) {
  return [['bank', methodName('bank')], ['cash', 'מזומן'], ...db.cards.map(c => [c.id, '💳 ' + methodName(c.id)])]
    .map(([v, l]) => `<option value="${v}" ${v === sel ? 'selected' : ''}>${esc(l)}</option>`).join('');
}
function catOptions(type, sel) {
  return db.categories.filter(c => c.type === type)
    .map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${c.icon} ${esc(c.name)}</option>`).join('');
}

/* ---------------- finance engine ---------------- */
// חיובי כרטיס: עסקה בחודש M יורדת מהעו"ש ביום החיוב של חודש M+1 (ובתשלומים — בחודשים הבאים)
function cardCharges(t) {
  const c = cardById(t.method); if (!c) return [];
  const n = Math.max(1, Math.round(+t.inst || 1)), [y, m] = parseYM(t.date), per = t.amount / n, out = [];
  for (let k = 0; k < n; k++) {
    const [yy, mm] = addMonths(y, m, 1 + k);
    out.push({date: iso(yy, mm, Math.min(+c.chargeDay || 10, daysIn(yy, mm))), amount: per, k: k + 1, n});
  }
  return out;
}
let EV = null;
function events() {
  if (EV) return EV;
  EV = [];
  for (const t of db.tx) {
    const s = t.type === 'income' ? 1 : -1;
    if (isCard(t.method)) for (const c of cardCharges(t)) EV.push({date: c.date, amt: s * c.amount, card: t.method, tx: t, k: c.k, n: c.n});
    else EV.push({date: t.date, amt: s * t.amount, tx: t});
  }
  return EV;
}
function monthTx(y, m) { const k = ymKey(y, m); return db.tx.filter(t => t.date.startsWith(k)); }
// בסיס צריכה — לפי תאריך העסקה
function summary(y, m) {
  let inc = 0, exp = 0, sav = 0; const byCat = {};
  for (const t of monthTx(y, m)) {
    if (t.type === 'income') { inc += t.amount; continue; }
    if (catById(t.catId).kind === 'saving') sav += t.amount; else exp += t.amount;
    byCat[t.catId] = (byCat[t.catId] || 0) + t.amount;
  }
  return {inc, exp, sav, byCat};
}
// בסיס מזומן — מה נכנס/יצא מהעו"ש בפועל בחודש
function cashMonth(y, m) {
  const k = ymKey(y, m); let inc = 0, direct = 0, card = 0, debt = 0, net = 0;
  for (const e of events()) {
    if (!e.date.startsWith(k)) continue;
    net += e.amt;
    if (e.card) card -= e.amt;
    else if (e.amt > 0) inc += e.amt;
    else if (e.tx.debtId) debt -= e.amt;
    else direct -= e.amt;
  }
  return {inc, direct, card, debt, net};
}
function balanceAt(dateISO) {
  const s = db.settings; let b = +s.openingBalance || 0;
  for (const e of events()) if (e.date >= s.openingDate && e.date <= dateISO) b += e.amt;
  return b;
}
function debtPaid(d) { return sum(db.tx.filter(t => t.debtId === d.id && t.date >= (d.balanceDate || '0')), t => t.amount); }
function debtRemaining(d) { return Math.max(0, (+d.balance || 0) - debtPaid(d)); }
function payoffMonths(B, P, ratePct) {
  if (B <= 0.5) return 0; if (!(P > 0)) return Infinity;
  const r = (+ratePct || 0) / 100 / 12;
  if (!r) return Math.ceil(B / P);
  if (P <= B * r) return Infinity;
  return Math.ceil(-Math.log(1 - r * B / P) / Math.log(1 + r));
}
// סימולציית החזר חודשית: סך הריבית עד הסגירה
function totalInterest(B, P, ratePct) {
  const r = (+ratePct || 0) / 100 / 12; let tot = 0;
  if (!r || !(P > 0) || P <= B * r) return 0;
  for (let i = 0; i < 600 && B > 0.5; i++) { const int = B * r; tot += int; B = B + int - P; }
  return tot;
}
function goalSaved(g) { return (+g.initial || 0) + sum(db.tx.filter(t => t.goalId === g.id), t => t.amount); }

// פריטים צפויים: הוראות קבע / הכנסות קבועות + תשלומי חוב שעדיין לא נרשמו בחודש
function planned(y, m) {
  const k = ymKey(y, m), out = [];
  for (const r of db.recurring) {
    if (r.active === false) continue;
    if (r.startYM && k < r.startYM) continue;
    if (db.tx.some(t => t.recId === r.id && t.date.startsWith(k))) continue;
    out.push({kind: 'rec', id: r.id, name: r.name, date: iso(y, m, Math.min(+r.day || 1, daysIn(y, m))), amt: (r.type === 'income' ? 1 : -1) * r.amount, method: r.method, catId: r.catId, type: r.type});

    if (db.tx.some(t => t.debtId === d.id && t.date.startsWith(k))) continue;
    out.push({kind: 'debt', id: d.id, name: 'תשלום: ' + d.name, date: iso(y, m, Math.min(+d.payDay || 1, daysIn(y, m))), amt: -Math.min(+d.monthly, rem), method: 'bank', catId: 'c-debt', type: 'expense'});

}
// תזרים חודשי כולל פריטים צפויים (לחודש הנוכחי והלאה)
function cashMonthF(y, m) {

function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}

}

function barsChart(el, labels, series, {height = 250, tipFn} = {}) {
  const W = Math.max(280, el.clientWidth), H = height, axisW = 42, top = 10, bottom = 26, left = 4, right = W - axisW;
  const plotW = right - left, plotH = H - top - bottom, n = labels.length, bw = plotW / n;
  const max = niceMax(Math.max(1, ...series.flatMap(s => s.values)) / 4) * 4;
  const yv = v => top + plotH - (v / max) * plotH;
  const ns = series.length, gap = 2, bwi = Math.max(3, Math.min(20, (bw * 0.66 - (ns - 1) * gap) / ns)), gw = ns * bwi + (ns - 1) * gap;
  let s = '';

    s += `<line class="grid-l ${t === 0 ? 'base' : ''}" x1="${left}" x2="${right}" y1="${yy}" y2="${yy}"/><text class="ax" x="${right + 8}" y="${yy + 4}">${shortMoney(v)}</text>`;
  }

    });

  }
  for (let i = 0; i < n; i++) s += `<rect class="hit" data-i="${i}" x="${right - (i + 1) * bw}" y="${top}" width="${bw}" height="${plotH + bottom}"/>`;
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img">${s}</svg>`;
  wireHover(el, i => { el.querySelectorAll('.band').forEach(b => b.classList.toggle('on', +b.dataset.b === i)); return tipFn(i); });

// קו (יתרה) — מוצק לנתוני אמת, מקווקו לתחזית
function lineChart(el, labels, values, {height = 230, split = null, tipFn} = {}) {
  const W = Math.max(280, el.clientWidth), H = height, axisW = 44, top = 14, bottom = 26, left = 6, right = W - axisW;
  const plotW = right - left, plotH = H - top - bottom, n = labels.length, bw = plotW / n;
  const vals = values.filter(v => v != null);

  const step = niceMax((mx - mn) / 4 || 1);
  mx = Math.ceil(mx / step) * step; mn = Math.floor(mn / step) * step; if (mx === mn) mx = step;
  const ticks = Math.round((mx - mn) / step);
  const xv = i => right - (i + 0.5) * bw, yv = v => top + (mx - v) / (mx - mn) * plotH;
  let s = `<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>`;
  for (let t = 0; t <= ticks; t++) {

  }
  if (mn < 0) s += `<line class="grid-l base" x1="${left}" x2="${right}" y1="${yv(0)}" y2="${yv(0)}" style="stroke-width:1.5"/>`;
  const pts = values.map((v, i) => v == null ? null : [xv(i), yv(v), i]).filter(Boolean);
  const sp = split == null ? n - 1 : split;
  const act = pts.filter(p => p[2] <= sp), proj = pts.filter(p => p[2] >= sp);
  const d = arr => arr.map((p, j) => (j ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');
  if (act.length > 1) s += `<path d="${d(act)}L${act[act.length - 1][0]},${yv(Math.max(mn, 0))}L${act[0][0]},${yv(Math.max(mn, 0))}Z" fill="url(#ga)"/>`;
  if (act.length > 1) s += `<path d="${d(act)}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  if (proj.length > 1) s += `<path d="${d(proj)}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round" opacity=".85"/>`;
  const last = act[act.length - 1];
  if (last) s += `<circle cx="${last[0]}" cy="${last[1]}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
  for (let i = 0; i < n; i++) s += `<text class="ax" x="${xv(i)}" y="${H - 7}" text-anchor="middle">${labels[i]}</text>`;
  s += `<line class="xh" x1="0" x2="0" y1="${top}" y2="${top + plotH}"/><circle class="hdot" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
  for (let i = 0; i < n; i++) s += `<rect class="hit" data-i="${i}" x="${right - (i + 1) * bw}" y="${top}" width="${bw}" height="${plotH + bottom}"/>`;
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img">${s}</svg>`;
  const xh = el.querySelector('.xh'), hd = el.querySelector('.hdot');

    ${kpi({label: 'נשאר בכיס (עודף)', icon: 'coins', value: `<span class="${surplus < 0 ? 'neg' : ''}">${money(surplus)}</span>`, foot: s.inc ? `<span class="chip ${rate >= .15 ? 'good' : rate >= 0 ? 'neutral' : 'bad'}">${rate < 0 ? ico('alert', 12) : ''}שיעור חיסכון ${pct(rate)}</span>` : 'אין הכנסות רשומות'})}
    ${kpi({label: isFutureOrCur ? 'יתרת עו״ש צפויה לסוף החודש' : 'יתרת עו״ש בסוף החודש', icon: 'wallet', value: `<span class="${endBal < 0 ? 'neg' : ''}">${money(endBal)}</span>`, foot: isFutureOrCur && pl.length ? `כולל ${pl.length} פריטים צפויים` : 'לפי התנועות שנרשמו'})}
    ${kpi({label: 'חיובי אשראי החודש', icon: 'card', value: money(cm.card), foot: db.cards.length ? `${db.cards.length} כרטיסים · יורד מהעו״ש` : '<a href="#" data-act="go" data-id="cards">הוסף כרטיס</a>'})}
    ${kpi({label: 'יתרת חובות', icon: 'bank', value: money(debtsTot), foot: debtsMonthly ? `החזר חודשי ${money(debtsMonthly)}` : 'אין חובות פעילים'})}
  </div>`;

  // categories
  const cats = Object.entries(s.byCat).sort((a, b) => b[1] - a[1]);
  const top = cats.slice(0, 7), maxV = Math.max(1, ...top.map(([id, v]) => Math.max(v, +catById(id).budget || 0)));
  const catHtml = top.length ? `<div class="hbars">${top.map(([id, v]) => {
    const c = catById(id), b = +c.budget || 0, st = b ? (v > b ? 'over' : v > b * .85 ? 'near' : '') : '';
    return `<div><div class="hbar-h"><span class="nm"><span class="emo">${c.icon}</span>${esc(c.name)}</span>
      <span class="vl">${st === 'over' ? `<span class="neg" title="חריגה מהתקציב">${ico('alert', 14)}</span>` : ''}${money(v)}${b ? `<small>/ ${plain(b)}</small>` : ''}</span></div>
      <div class="track"><div class="fill ${st}" style="width:${v / maxV * 100}%"></div>${b ? `<span class="bmark" style="right:${b / maxV * 100}%" title="תקציב ${plain(b)}"></span>` : ''}</div></div>`;
  }).join('')}</div>${cats.length > 7 ? `<div style="margin-top:12px"><button class="btn ghost sm" data-act="go" data-id="budget">לכל ${cats.length} הקטגוריות ←</button></div>` : ''}`
    : emptyBox('pie', 'אין הוצאות רשומות בחודש הזה');

  // upcoming — בחודש הנוכחי: 30 הימים הקרובים; בחודש עתידי: כל החודש
  const t0 = todayISO(), [ny, nm] = addMonths(y, m, 1);
  const lim = isCur ? (() => { const d = new Date(); d.setDate(d.getDate() + 30); return iso(d.getFullYear(), d.getMonth(), d.getDate()); })() : monthEnd(y, m);
  const from = isCur ? t0 : iso(y, m, 1);
  const upPl = isFutureOrCur ? [...pl, ...(isCur ? planned(ny, nm) : [])].filter(p => p.date <= lim) : [];
  const upCards = [];
  for (const [yy, mm] of isCur ? [[y, m], [ny, nm]] : [[y, m]]) for (const c of db.cards) {
    const evs = events().filter(e => e.card === c.id && e.date.startsWith(ymKey(yy, mm)));
    if (evs.length && evs[0].date >= from && evs[0].date <= lim) upCards.push({c, date: evs[0].date, amt: sum(evs, e => e.amt)});
  }
  const upItems = [...upCards.map(u => ({date: u.date, html: `<div class="li"><div class="datebox"><b>${+u.date.slice(8)}</b><span>${SHORT[+u.date.slice(5, 7) - 1]}</span></div><div class="main"><div class="ttl">חיוב ${esc(u.c.name)} ••${esc(u.c.last4 || '')}</div><div class="meta">סך עסקאות ותשלומים בכרטיס</div></div><div class="amt">${money(u.amt, {sign: true})}</div><button class="icon-btn" data-act="go" data-id="cards" title="פירוט">${ico('left', 16)}</button></div>`})),
    ...upPl.map(p => ({date: p.date, html: plannedLine(p)}))].sort((a, b) => a.date.localeCompare(b.date));
  const upSum = sum(upCards, u => u.amt) + sum(upPl, p => p.amt);
  const upHtml = upItems.length ? `<div class="list">${upItems.map(x => x.html).join('')}</div>
    <div class="sumbar" style="margin:12px 0 0;justify-content:space-between"><span>סה״כ צפוי: <b class="${upSum < 0 ? '' : 'pos'}">${money(upSum, {sign: true})}</b></span>${pl.length > 1 ? `<button class="btn sm" data-act="recordAll">${ico('check', 14)} רשום את צפויי ${MONTHS[m]}</button>` : ''}</div>`
    : emptyBox('check', isFutureOrCur ? 'אין חיובים או פריטים צפויים שטרם נרשמו' : 'חודש שעבר — אין פריטים צפויים');

  const recent = monthTx(y, m).sort((a, b) => b.date.localeCompare(a.date) || (b.ts || 0) - (a.ts || 0)).slice(0, 7);

  const html = `${kp}
    <div class="grid cols-2" style="margin-top:16px">
      <div class="panel"><div class="panel-h"><h3>הכנסות מול הוצאות — ${y}</h3><span class="sp"></span>
        <div class="legend"><span><i style="background:var(--income)"></i>הכנסות</span><span><i style="background:var(--expense)"></i>הוצאות</span></div></div>
        <div class="chart" id="chYear"></div></div>
      <div class="panel"><div class="panel-h"><h3>תובנות</h3><span class="sub">${monthLabel(y, m)}</span></div><div class="stack" style="gap:8px">${insights(y, m).join('')}</div></div>
    </div>
    <div class="grid cols-2" style="margin-top:16px">
      <div class="panel"><div class="panel-h"><h3>לאן הלך הכסף</h3><span class="sub">הוצאות לפי קטגוריה · הקו האנכי = תקציב</span></div>${catHtml}</div>
      <div class="panel"><div class="panel-h"><h3>צפוי לרדת / להיכנס</h3><span class="sub">${isCur ? '30 הימים הקרובים' : monthLabel(y, m)}</span></div>${upHtml}</div>
    </div>
    <div class="grid cols-2" style="margin-top:16px">
      <div class="panel"><div class="panel-h"><h3>יתרת עו״ש בסוף כל חודש — ${y}</h3><span class="sp"></span>
        <div class="legend"><span><i class="line"></i>בפועל</span><span><i class="dash"></i>תחזית</span></div></div><div class="chart" id="chBal"></div></div>
      <div class="panel"><div class="panel-h"><h3>תנועות אחרונות</h3><span class="sp"></span><button class="btn ghost sm" data-act="go" data-id="tx">הכול ←</button></div>
        ${recent.length ? `<div class="list">${recent.map(t => txLine(t)).join('')}</div>` : emptyBox('list', 'אין תנועות בחודש הזה', `<button class="btn sm" data-act="newTx">${ico('plus', 14)} הוסף תנועה</button>`)}</div>
    </div>`;
  return {html, after: () => { drawYearBars($('#chYear'), y); drawBalance($('#chBal'), y); }};
}
function drawYearBars(el, y) {
  const S = MONTHS.map((_, i) => summary(y, i));
  barsChart(el, SHORT, [{name: 'הכנסות', color: 'var(--income)', values: S.map(s => s.inc)}, {name: 'הוצאות', color: 'var(--expense)', values: S.map(s => s.exp)}], {
    tipFn: i => i == null ? null : `<div class="tt">${monthLabel(y, i)}</div>${tipRow('הכנסות', money(S[i].inc), 'var(--income)')}${tipRow('הוצאות', money(S[i].exp), 'var(--expense)')}${S[i].sav ? tipRow('לחיסכון', money(S[i].sav)) : ''}<hr>${tipRow('עודף / גירעון', `<span class="${S[i].inc - S[i].exp < 0 ? 'neg' : 'pos'}">${money(S[i].inc - S[i].exp, {sign: true})}</span>`)}`,
  });
}
function drawBalance(el, y) {
  const open = db.settings.openingDate.slice(0, 7), cy = curYM();
  const vals = MONTHS.map((_, i) => ymKey(y, i) < open ? null : balanceOrForecast(y, i));
  let split = null; for (let i = 0; i < 12; i++) if (ymKey(y, i) < cy) split = i;
  if (ymKey(y, 0) >= cy) split = -1;
  lineChart(el, SHORT, vals, {split: split === null ? -1 : split, tipFn: i => vals[i] == null ? null : `<div class="tt">${monthLabel(y, i)}</div>${tipRow(ymKey(y, i) >= cy ? 'יתרה צפויה' : 'יתרה בסוף החודש', `<span class="${vals[i] < 0 ? 'neg' : ''}">${money(vals[i])}</span>`, 'var(--accent)')}${tipRow('תזרים נטו', money(cashMonthF(y, i).net, {sign: true}))}`});
}
function insights(y, m) {
  const s = summary(y, m), out = [], add = (tone, icon, txt) => out.push(`<div class="ins ${tone}"><span class="ii">${ico(icon, 15)}</span><div>${txt}</div></div>`);
  const surplus = s.inc - s.exp;
  if (s.inc) {
    const r = surplus / s.inc;
    if (r < 0) add('bad', 'alert', `החודש ההוצאות גבוהות מההכנסות ב-<b>${money(-surplus)}</b>. כדאי לבדוק את הקטגוריות הגדולות.`);
    else if (r >= .2) add('good', 'check', `שיעור חיסכון מצוין: <b>${pct(r)}</b> מההכנסה נשארה בצד. המשך כך!`);
    else add('info', 'coins', `נשאר <b>${money(surplus)}</b> (${pct(r)} מההכנסה). יעד מומלץ: לפחות 15%-20%.`);
  }
  const cats = Object.entries(s.byCat).filter(([id]) => catById(id).kind !== 'saving').sort((a, b) => b[1] - a[1]);
  if (cats.length && s.exp) add('info', 'pie', `הקטגוריה הגדולה החודש: <b>${catById(cats[0][0]).icon} ${esc(catById(cats[0][0]).name)}</b> — ${pct(cats[0][1] / s.exp)} מההוצאות.`);
  const over = budgetAlerts(y, m);
  if (over.length) add('bad', 'alert', `חריגה מהתקציב ב-${over.length} קטגוריות: ${over.slice(0, 3).map(c => esc(c.name.split(' ')[0])).join(', ')}${over.length > 3 ? '…' : ''}.`);
  const prev3 = [1, 2, 3].map(k => summary(...addMonths(y, m, -k)).exp).filter(v => v > 0);
  if (prev3.length >= 2 && s.exp) {
    const avg = sum(prev3) / prev3.length, d = (s.exp - avg) / avg;
    if (d > .1) add('warn', 'trendUp', `ההוצאות גבוהות ב-${pct(d)} מהממוצע של ${prev3.length} החודשים הקודמים (${money(avg)}).`);
    else if (d < -.1) add('good', 'trendDown', `ההוצאות נמוכות ב-${pct(-d)} מהממוצע של ${prev3.length} החודשים הקודמים. כל הכבוד!`);
  }
  const [ny, nm] = addMonths(y, m, 1), nc = cashMonth(ny, nm).card;
  if (nc > 0) add('info', 'card', `חיובי אשראי שכבר ידועים ל${MONTHS[nm]}: <b>${money(nc)}</b> (כולל תשלומים).`);
  const negF = ymKey(y, m) >= curYM() && balanceOrForecast(y, m) < 0;
  if (negF) add('bad', 'wallet', `התחזית מראה <b>יתרה שלילית</b> בסוף ${MONTHS[m]}. שקול לדחות הוצאות או להעביר כסף לעו״ש.`);
  const hi = db.debts.filter(d => debtRemaining(d) > 0.5 && +d.rate > 0).sort((a, b) => b.rate - a.rate)[0];
  if (hi && db.debts.filter(d => debtRemaining(d) > 0.5).length > 1) add('info', 'bank', `אם יש כסף פנוי — כדאי לפרוע קודם את <b>${esc(hi.name)}</b> (ריבית ${nf2.format(hi.rate)}%, הגבוהה ביותר).`);
  if (!out.length) add('info', 'bulb', 'הוסף הכנסות והוצאות לחודש כדי לקבל תובנות.');
  return out;
}

/* ---------- Cash flow ---------- */
function viewCashflow() {
  const {y, m} = ui, k = ymKey(y, m), [py, pm] = addMonths(y, m, -1), prevEnd = monthEnd(py, pm);
  const future = k >= curYM();
  const open = ymKey(py, pm) >= curYM() ? forecastAt(prevEnd) : balanceAt(prevEnd);
  const rows = [], cardAgg = {};
  for (const e of events()) {
    if (!e.date.startsWith(k) || e.date < db.settings.openingDate) continue;
    if (e.card) {
      const key = e.card + e.date;
      (cardAgg[key] = cardAgg[key] || {date: e.date, card: e.card, amt: 0, cnt: 0}).amt += e.amt; cardAgg[key].cnt++;
    } else rows.push({date: e.date, amt: e.amt, title: e.tx.note || catById(e.tx.catId).name, meta: `${catById(e.tx.catId).icon} ${catById(e.tx.catId).name} · ${methodName(e.tx.method, true)}`, tx: e.tx});
  }
  for (const a of Object.values(cardAgg)) { const c = cardById(a.card); rows.push({date: a.date, amt: a.amt, title: `חיוב כרטיס ${c.name} ••${c.last4 || ''}`, meta: `${a.cnt} עסקאות ותשלומים`, card: a.card}); }
  if (future) for (const p of plannedUntil(monthEnd(y, m)).filter(p => p.cashDate.startsWith(k))) rows.push({date: p.cashDate, amt: p.amt, title: p.name, meta: `${catById(p.catId).icon} ${catById(p.catId).name} · ${methodName(p.method, true)}`, planned: p});
  rows.sort((a, b) => a.date.localeCompare(b.date) || b.amt - a.amt);
  let bal = open; for (const r of rows) { bal += r.amt; r.bal = bal; }
  const inSum = sum(rows.filter(r => r.amt > 0), r => r.amt), outSum = -sum(rows.filter(r => r.amt < 0), r => r.amt);

  const ledger = rows.length ? `<div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>תאריך</th><th>תיאור</th><th class="n">סכום</th><th class="n">יתרה אחרי</th><th></th></tr></thead>
    <tbody><tr class="sec"><td>${fmtDate(iso(y, m, 1))}</td><td>יתרת פתיחה</td><td></td><td class="n">${money(open)}</td><td></td></tr>
    ${rows.map(r => `<tr class="${r.planned ? 'dim' : ''}"><td>${fmtDate(r.date)}</td>
      <td><div style="font-weight:600">${esc(r.title)} ${r.planned ? '<span class="chip info">צפוי</span>' : ''}</div><div class="hint">${esc(r.meta)}</div></td>
      <td class="n ${r.amt > 0 ? 'pos' : ''}" style="font-weight:700">${money(r.amt, {sign: true})}</td>
      <td class="n ${r.bal < 0 ? 'neg' : ''}">${money(r.bal)}</td>
      <td>${r.planned ? `<button class="btn sm" data-act="recordPlanned" data-id="${r.planned.kind}:${r.planned.id}:${r.planned.date}">${ico('check', 13)} רשום</button>` : r.tx ? `<div class="row-actions"><button class="icon-btn" data-act="editTx" data-id="${r.tx.id}">${ico('edit', 15)}</button></div>` : `<div class="row-actions"><button class="icon-btn" data-act="go" data-id="cards">${ico('left', 15)}</button></div>`}</td></tr>`).join('')}
    </tbody><tfoot><tr><td></td><td>יתרת סגירה ${future ? '(צפויה)' : ''}</td><td class="n">${money(inSum - outSum, {sign: true})}</td><td class="n ${bal < 0 ? 'neg' : ''}">${money(bal)}</td><td></td></tr></tfoot></table></div>`
    : emptyBox('flow', 'אין תנועות בעו״ש בחודש הזה');

  // year table
  const cy = curYM(), Y = MONTHS.map((_, i) => ({...cashMonthF(y, i), end: ymKey(y, i) < db.settings.openingDate.slice(0, 7) ? null : balanceOrForecast(y, i), fut: ymKey(y, i) >= cy}));
  const line = (label, f, cls = '', tot = true) => `<tr class="${cls}"><td class="sticky">${label}</td>${Y.map(r => `<td class="n">${f(r)}</td>`).join('')}${tot ? `<td class="n"><b>${f(Y.reduce((a, r) => ({inc: a.inc + r.inc, direct: a.direct + r.direct, card: a.card + r.card, debt: a.debt + r.debt, net: a.net + r.net}), {inc: 0, direct: 0, card: 0, debt: 0, net: 0}))}</b></td>` : '<td></td>'}</tr>`;
  const yt = `<div class="tbl-wrap"><table class="tbl year">
    <thead><tr><th class="sticky"></th>${SHORT.map((s, i) => `<th class="n" ${ymKey(y, i) === cy ? 'style="color:var(--accent)"' : ''}>${s}</th>`).join('')}<th class="n">סה״כ</th></tr></thead><tbody>
    ${line('💰 הכנסות לעו״ש', r => r.inc ? money(r.inc) : '<span class="muted">—</span>')}
    ${line('🏦 הוצאות ישירות מהעו״ש', r => r.direct ? money(-r.direct) : '<span class="muted">—</span>')}
    ${line('💳 חיובי אשראי', r => r.card ? money(-r.card) : '<span class="muted">—</span>')}
    ${line('📉 החזרי חובות', r => r.debt ? money(-r.debt) : '<span class="muted">—</span>')}
    ${line('תזרים נטו', r => `<span class="${r.net < 0 ? 'neg' : r.net > 0 ? 'pos' : ''}">${money(r.net, {sign: true})}</span>`, 'total')}
    <tr class="total"><td class="sticky">יתרה בסוף החודש</td>${Y.map(r => `<td class="n ${r.end < 0 ? 'neg' : ''}" ${r.fut ? 'title="תחזית"' : ''}>${r.end == null ? '<span class="muted">—</span>' : (r.fut ? '<span class="muted" style="font-weight:400">~</span>' : '') + money(r.end)}</td>`).join('')}<td></td></tr>
    </tbody></table></div><div class="hint" style="margin-top:8px">מהחודש הנוכחי והלאה הסכומים כוללים פריטים צפויים. ~ = תחזית הכוללת הוראות קבע, הכנסות קבועות ותשלומי חובות שעדיין לא נרשמו. יתרת הפתיחה נקבעת בהגדרות.</div>`;

  const html = `<div class="grid kpis">
      ${kpi({label: 'יתרת פתיחה', icon: 'wallet', value: money(open), foot: `תחילת ${MONTHS[m]}`})}
      ${kpi({label: 'נכנס לעו״ש', icon: 'trendUp', cls: 'inc', value: money(inSum), foot: future ? 'כולל צפוי' : 'בפועל'})}
      ${kpi({label: 'יצא מהעו״ש', icon: 'trendDown', cls: 'exp', value: money(outSum), foot: 'כולל חיובי אשראי'})}
      ${kpi({label: future ? 'יתרת סגירה צפויה' : 'יתרת סגירה', icon: 'coins', value: `<span class="${bal < 0 ? 'neg' : ''}">${money(bal)}</span>`, foot: `${delta(bal, open, true)} מתחילת החודש`})}
    </div>
    <div class="grid cols-2" style="margin-top:16px">
      <div class="panel"><div class="panel-h"><h3>יומן עו״ש — ${monthLabel(y, m)}</h3><span class="sub">כל תנועה עם היתרה שנשארת אחריה</span></div>${ledger}</div>
      <div class="stack">
        <div class="panel"><div class="panel-h"><h3>מגמת יתרה — ${y}</h3><span class="sp"></span><div class="legend"><span><i class="line"></i>בפועל</span><span><i class="dash"></i>תחזית</span></div></div><div class="chart" id="chBal2"></div></div>
        <div class="panel"><div class="panel-h"><h3>איך לקרוא את התזרים</h3></div><div class="stack" style="gap:8px;font-size:13px" >
          <div class="ins info"><span class="ii">${ico('card', 14)}</span><div>עסקאות אשראי נכנסות לתזרים <b>ביום החיוב</b> של הכרטיס בחודש שאחרי, וכל תשלום בחודש שלו.</div></div>
          <div class="ins info"><span class="ii">${ico('repeat', 14)}</span><div>פריטים מסומנים <b>"צפוי"</b> מגיעים מהוראות הקבע והחובות. לחיצה על "רשום" הופכת אותם לתנועה בפועל.</div></div>
        </div></div>
      </div>
    </div>
    <div class="panel" style="margin-top:16px"><div class="panel-h"><h3>תזרים שנתי — ${y}</h3><span class="sub">בסיס מזומן: מתי הכסף נכנס ויצא בפועל</span></div>${yt}</div>`;
  return {html, after: () => drawBalance($('#chBal2'), y)};
}

/* ---------- Transactions ---------- */
function filteredTx() {
  const f = ui.f, ky = String(ui.y), km = ymKey(ui.y, ui.m), q = f.q.trim().toLowerCase();
  return db.tx.filter(t =>
    (f.scope === 'all' || (f.scope === 'year' ? t.date.startsWith(ky) : t.date.startsWith(km))) &&
    (!f.type || t.type === f.type) && (!f.cat || t.catId === f.cat) &&
    (!f.method || (f.method === 'anycard' ? isCard(t.method) : t.method === f.method)) &&
    (!q || (t.note || '').toLowerCase().includes(q) || catById(t.catId).name.toLowerCase().includes(q) || String(t.amount).includes(q))
  ).sort((a, b) => b.date.localeCompare(a.date) || (b.ts || 0) - (a.ts || 0));
}
function txTable() {
  const list = filteredTx(), inc = sum(list.filter(t => t.type === 'income'), t => t.amount), exp = sum(list.filter(t => t.type !== 'income'), t => t.amount);
  if (!list.length) return emptyBox('search', 'לא נמצאו תנועות', `<button class="btn sm" data-act="newTx">${ico('plus', 14)} תנועה חדשה</button>`);
  return `<div class="sumbar"><span>${list.length} תנועות</span><span>הכנסות: <b class="pos">${money(inc)}</b></span><span>הוצאות: <b>${money(exp)}</b></span><span>הפרש: <b class="${inc - exp < 0 ? 'neg' : ''}">${money(inc - exp, {sign: true})}</b></span></div>
  <div class="tbl-wrap"><table class="tbl resp"><thead><tr><th>תאריך</th><th>תיאור</th><th>קטגוריה</th><th>אמצעי תשלום</th><th class="n">סכום</th><th></th></tr></thead><tbody>
  ${list.map(t => { const c = catById(t.catId), inc = t.type === 'income', cardT = isCard(t.method);
    return `<tr><td class="c-date"><span class="emo">${c.icon}</span></td>
      <td class="c-desc">${esc(t.note || c.name)}<div class="hint">${fmtDate(t.date)}${t.recId ? ' · ' + ico('repeat', 11) + ' קבוע' : ''}${t.debtId ? ' · ' + esc(db.debts.find(d => d.id === t.debtId)?.name || '') : ''}</div></td>
      <td class="c-cat"><span class="tag">${esc(c.name)}</span></td>
      <td class="c-meth"><span class="tag ${cardT ? 'card' : ''}">${esc(methodName(t.method, true))}${cardT && +t.inst > 1 ? ` · ${t.inst} תש׳` : ''}</span></td>
      <td class="n c-amt ${inc ? 'pos' : ''}" style="font-weight:700">${money(inc ? t.amount : -t.amount, {sign: true})}${cardT && +t.inst > 1 ? `<div class="hint">${money(t.amount / t.inst)} לחודש</div>` : ''}</td>
      <td class="c-act"><div class="row-actions">
        <button class="icon-btn" data-act="editTx" data-id="${t.id}" title="עריכה">${ico('edit', 15)}</button>
        <button class="icon-btn" data-act="dupTx" data-id="${t.id}" title="שכפול">${ico('copy', 15)}</button>
        <button class="icon-btn del" data-act="delTx" data-id="${t.id}" title="מחיקה">${ico('trash', 15)}</button></div></td></tr>`; }).join('')}
  </tbody></table></div>`;
}
function viewTx() {
  const f = ui.f;
  const html = `<div class="panel"><div class="filters">
    <div class="search">${ico('search', 16)}<input class="input" id="fq" placeholder="חיפוש לפי תיאור, קטגוריה או סכום…" value="${esc(f.q)}"></div>
    <select class="input" data-filter="scope"><option value="month" ${f.scope === 'month' ? 'selected' : ''}>${monthLabel(ui.y, ui.m)}</option><option value="year" ${f.scope === 'year' ? 'selected' : ''}>כל שנת ${ui.y}</option><option value="all" ${f.scope === 'all' ? 'selected' : ''}>כל התקופות</option></select>
    <select class="input" data-filter="type"><option value="">הכנסות והוצאות</option><option value="expense" ${f.type === 'expense' ? 'selected' : ''}>הוצאות</option><option value="income" ${f.type === 'income' ? 'selected' : ''}>הכנסות</option></select>
    <select class="input" data-filter="cat"><option value="">כל הקטגוריות</option>${db.categories.map(c => `<option value="${c.id}" ${f.cat === c.id ? 'selected' : ''}>${c.icon} ${esc(c.name)}</option>`).join('')}</select>
    <select class="input" data-filter="method"><option value="">כל אמצעי התשלום</option><option value="bank" ${f.method === 'bank' ? 'selected' : ''}>עו״ש</option><option value="cash" ${f.method === 'cash' ? 'selected' : ''}>מזומן</option><option value="anycard" ${f.method === 'anycard' ? 'selected' : ''}>כל כרטיסי האשראי</option>${db.cards.map(c => `<option value="${c.id}" ${f.method === c.id ? 'selected' : ''}>💳 ${esc(methodName(c.id))}</option>`).join('')}</select>

  return {html, after: () => { $('#fq').addEventListener('input', e => { ui.f.q = e.target.value; $('#txList').innerHTML = txTable(); }); }};
}

/* ---------- Cards ---------- */
function viewCards() {
  if (!db.cards.length) return {html: `<div class="panel">${emptyBox('card', 'עוד לא הוגדרו כרטיסי אשראי. הוסף כרטיס כדי שהמערכת תחשב לבד מתי כל עסקה יורדת מהעו״ש.', `<button class="btn primary" data-act="cardForm">${ico('plus', 16)} הוסף כרטיס</button>`)}</div>`};
  const {y, m} = ui, k = ymKey(y, m), [ny, nm] = addMonths(y, m, 1), nk = ymKey(ny, nm);
  const tiles = db.cards.map((c, i) => {
    const thisM = -sum(events().filter(e => e.card === c.id && e.date.startsWith(k)), e => e.amt);
    const nextM = -sum(events().filter(e => e.card === c.id && e.date.startsWith(nk)), e => e.amt);
    const open = -sum(events().filter(e => e.card === c.id && e.date > todayISO()), e => e.amt);
    const lim = +c.limit || 0;
    return `<div class="cc ${c.color || 'g' + (i % 6 + 1)}">
      <div class="cc-top">${ico('card', 20)}<span class="cc-name">${esc(c.name)}</span><span class="sp"></span>
        <button class="icon-btn" data-act="cardForm" data-id="${c.id}" title="עריכה">${ico('edit', 15)}</button></div>
      <div class="cc-sub" style="margin-top:12px">חיוב ב-${c.chargeDay} ב${MONTHS[m]}</div>
      <div class="cc-amt"><span class="num">${plain(thisM)}</span></div>
      <div class="cc-sub">${MONTHS[nm]}: <span class="num">${plain(nextM)}</span> · יתרה פתוחה לחיוב: <span class="num">${plain(open)}</span></div>
      ${lim ? `<div class="lim" title="ניצול מסגרת"><div style="width:${Math.min(100, open / lim * 100)}%"></div></div><div class="cc-sub" style="margin-top:4px">ניצול מסגרת ${Math.round(open / lim * 100)}% מתוך <span class="num">${plain(lim)}</span></div>` : ''}
      <div class="cc-num">•••• •••• •••• ${esc(c.last4 || '----')}</div></div>`;
  }).join('');

  const breakdown = db.cards.map(c => {
    const evs = events().filter(e => e.card === c.id && e.date.startsWith(k)).sort((a, b) => a.tx.date.localeCompare(b.tx.date));
    if (!evs.length) return '';
    return `<div class="panel"><div class="panel-h"><h3>${esc(c.name)} ••${esc(c.last4 || '')}</h3><span class="sub">חיוב ${fmtDate(evs[0].date)} · ${evs.length} פריטים</span><span class="sp"></span><b>${money(-sum(evs, e => e.amt))}</b></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>תאריך עסקה</th><th>תיאור</th><th>תשלום</th><th class="n">בחיוב הזה</th><th></th></tr></thead><tbody>
      ${evs.map(e => `<tr><td>${fmtDate(e.tx.date)}</td><td>${catById(e.tx.catId).icon} ${esc(e.tx.note || catById(e.tx.catId).name)}</td><td>${e.n > 1 ? `<span class="tag card">${e.k} מתוך ${e.n}</span>` : '<span class="muted">רגיל</span>'}</td><td class="n ${e.amt > 0 ? 'pos' : ''}" style="font-weight:600">${money(-e.amt)}</td><td><div class="row-actions"><button class="icon-btn" data-act="editTx" data-id="${e.tx.id}">${ico('edit', 15)}</button></div></td></tr>`).join('')}
      </tbody></table></div></div>`;
  }).join('');

  // future obligations, next 6 months from selected month
  const months = [...Array(6)].map((_, i) => addMonths(y, m, i + 1));
  const fut = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>כרטיס</th>${months.map(([yy, mm]) => `<th class="n">${SHORT[mm]} ${String(yy).slice(2)}</th>`).join('')}</tr></thead><tbody>
    ${db.cards.map(c => `<tr><td>${esc(c.name)}</td>${months.map(([yy, mm]) => { const v = -sum(events().filter(e => e.card === c.id && e.date.startsWith(ymKey(yy, mm))), e => e.amt); return `<td class="n">${v ? money(v) : '<span class="muted">—</span>'}</td>`; }).join('')}</tr>`).join('')}
    </tbody><tfoot><tr><td>סה״כ</td>${months.map(([yy, mm]) => `<td class="n">${money(cashMonth(yy, mm).card)}</td>`).join('')}</tr></tfoot></table></div>
    <div class="hint" style="margin-top:8px">מבוסס על עסקאות שכבר נרשמו (בעיקר תשלומים). עסקאות חדשות יתווספו לסכומים.</div>`;

  const t0 = todayISO();

    <div class="meta">${esc(methodName(a.t.method, true))} · ${money(a.per)} לחודש · נגמר ב${MONTHS[+a.last.slice(5, 7) - 1]} ${a.last.slice(0, 4)}</div>
    <div class="progress" style="height:6px;margin-top:6px"><div style="width:${(a.t.inst - a.left) / a.t.inst * 100}%"></div></div></div>
    <div class="amt">${money(a.left * a.per)}<div class="hint">${a.left} תשלומים נותרו</div></div></div>`).join('')}</div>` : emptyBox('check', 'אין עסקאות פתוחות בתשלומים');

  return {html: `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(270px,1fr))">${tiles}
      <button class="panel" data-act="cardForm" style="border-style:dashed;cursor:pointer;display:grid;place-items:center;min-height:170px;color:var(--text-2);background:transparent">${ico('plus', 26)}<span>הוסף כרטיס</span></button></div>
    <div class="grid cols-2" style="margin-top:16px">
      <div class="stack">${breakdown || `<div class="panel">${emptyBox('card', `אין חיובי אשראי ב${monthLabel(y, m)}`)}</div>`}</div>
      <div class="stack">
        <div class="panel"><div class="panel-h"><h3>התחייבויות עתידיות</h3><span class="sub">6 החודשים הבאים</span></div>${fut}</div>
        <div class="panel"><div class="panel-h"><h3>עסקאות בתשלומים פעילות</h3></div>${instHtml}</div>
      </div></div>`};
}

/* ---------- Debts ---------- */
function viewDebts() {
  const act = db.debts.filter(d => debtRemaining(d) > 0.5), done = db.debts.filter(d => debtRemaining(d) <= 0.5);
  const tot = sum(act, debtRemaining), monthly = sum(act, d => d.monthly);
  const paidYear = sum(db.tx.filter(t => t.debtId && t.date.startsWith(String(ui.y))), t => t.amount);
  const maxM = Math.max(0, ...act.map(d => payoffMonths(debtRemaining(d), +d.monthly, d.rate)));
  const [fy, fm] = addMonths(NOW.getFullYear(), NOW.getMonth(), maxM);
  const free = !act.length ? 'אין חובות 🎉' : isFinite(maxM) ? `${MONTHS[fm]} ${fy}` : 'לא ניתן לחשב';
  const card = d => {
    const rem = debtRemaining(d), orig = Math.max(+d.original || 0, +d.balance || 0, rem), paidAll = orig - rem;
    const mths = payoffMonths(rem, +d.monthly, d.rate), [ey, em] = addMonths(NOW.getFullYear(), NOW.getMonth(), isFinite(mths) ? mths : 0);
    const interest = isFinite(mths) ? totalInterest(rem, +d.monthly, d.rate) : 0;
    const kind = DEBT_KINDS[d.kind] || DEBT_KINDS.other;
    const hist = db.tx.filter(t => t.debtId === d.id).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 4);
    return `<div class="panel dcard"><div class="dh"><span class="emo">${kind[1]}</span><div style="flex:1;min-width:0"><h3 style="font-size:16px">${esc(d.name)}</h3><div class="hint">${esc(kind[0])}${d.lender ? ' · ' + esc(d.lender) : ''}${+d.rate ? ` · ריבית ${nf2.format(d.rate)}%` : ' · ללא ריבית'}</div></div>
      <button class="icon-btn" data-act="debtForm" data-id="${d.id}" title="עריכה">${ico('edit', 16)}</button><button class="icon-btn del" data-act="delDebt" data-id="${d.id}" title="מחיקה">${ico('trash', 16)}</button></div>
      <div class="dstats"><div><small>יתרה לתשלום</small><b>${money(rem)}</b></div><div><small>החזר חודשי</small><b>${money(d.monthly)}</b></div>
        <div><small>צפי לסיום</small><b>${rem <= .5 ? 'שולם ✓' : isFinite(mths) ? `${SHORT[em]} ${ey}` : '—'}</b></div></div>
      <div class="progress"><div style="width:${orig ? paidAll / orig * 100 : 0}%"></div></div>
      <div class="prog-meta"><span>שולם ${pct(orig ? paidAll / orig : 0)} מתוך ${plain(orig)}</span><span>${isFinite(mths) && rem > .5 ? `${mths} תשלומים${interest >= 1 ? ` · ריבית משוערת ${plain(interest)}` : ''}` : (!isFinite(mths) ? '<span class="neg">ההחזר לא מכסה את הריבית</span>' : '')}</span></div>
      ${hist.length ? `<div class="list" style="margin-top:10px">${hist.map(t => `<div class="li" style="padding:6px 0"><div class="main"><div class="meta">${fmtDate(t.date)} · ${esc(t.note || 'תשלום')}</div></div><div class="amt" style="font-weight:600">${money(t.amount)}</div></div>`).join('')}</div>` : ''}
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
        <button class="btn primary sm" data-act="payDebt" data-id="${d.id}">${ico('check', 14)} רשום תשלום</button>
        <button class="btn sm" data-act="updDebt" data-id="${d.id}">עדכן יתרה לפי דוח הבנק</button></div></div>`;
  };
  const order = act.length > 1 ? `<div class="panel"><div class="panel-h"><h3>סדר פירעון מומלץ</h3><span class="sub">שיטת "המפולת" — קודם הריבית הגבוהה</span></div>
    <div class="list">${[...act].sort((a, b) => (+b.rate || 0) - (+a.rate || 0) || debtRemaining(a) - debtRemaining(b)).map((d, i) => `<div class="li"><span class="emo" style="font-weight:800">${i + 1}</span><div class="main"><div class="ttl">${esc(d.name)}</div><div class="meta">ריבית ${nf2.format(+d.rate || 0)}%</div></div><div class="amt">${money(debtRemaining(d))}</div></div>`).join('')}</div>
    <div class="hint" style="margin-top:8px">כל שקל נוסף שתפנה — כדאי שילך לחוב הראשון ברשימה. כשהוא נסגר, ההחזר שלו עובר לבא בתור.</div></div>` : '';
  return {html: `<div class="grid kpis">
      ${kpi({label: 'סך יתרת חובות', icon: 'bank', cls: 'exp', value: money(tot), foot: `${act.length} חובות פעילים`})}
      ${kpi({label: 'החזר חודשי כולל', icon: 'repeat', value: money(monthly), foot: 'מתוזמן כ"צפוי" בתזרים'})}
      ${kpi({label: `שולם ב-${ui.y}`, icon: 'check', cls: 'inc', value: money(paidYear), foot: 'החזרים שנרשמו השנה'})}
      ${kpi({label: 'חופשי מחובות', icon: 'target', value: `<span style="font-size:22px">${free}</span>`, foot: 'לפי ההחזרים הנוכחיים'})}
    </div>
    <div style="display:flex;margin:18px 0 12px"><h3 style="font-size:16px">החובות שלי</h3><span class="sp"></span><button class="btn primary" data-act="debtForm">${ico('plus', 16)} הוסף חוב / הלוואה</button></div>
    ${db.debts.length ? `<div class="grid cols-2e">${act.map(card).join('')}</div>${order ? `<div style="margin-top:16px">${order}</div>` : ''}
      ${done.length ? `<h3 style="font-size:15px;margin:22px 0 12px" class="t2">חובות שנסגרו ✓</h3><div class="grid cols-2e">${done.map(card).join('')}</div>` : ''}`
      : `<div class="panel">${emptyBox('bank', 'אין חובות רשומים. הוסף הלוואות, משכנתא, מינוס או חוב לחבר — ותקבל צפי סיום ומעקב החזרים.')}</div>`}`};
}

/* ---------- Budget ---------- */
function viewBudget() {
  const {y, m} = ui, s = summary(y, m), exps = db.categories.filter(c => c.type === 'expense');
  const totalB = sum(exps, c => c.budget), totalA = sum(exps, c => s.byCat[c.id] || 0);
  const dayFrac = ymKey(y, m) === curYM() ? NOW.getDate() / daysIn(y, m) : ymKey(y, m) < curYM() ? 1 : 0;
  const rows = exps.map(c => {
    const a = s.byCat[c.id] || 0, b = +c.budget || 0, r = b ? a / b : 0;
    const st = !b ? '' : r > 1 ? 'over' : r > .85 ? 'near' : '';
    return `<tr><td><span class="emo">${c.icon}</span> ${esc(c.name)}</td>
      <td class="n" style="width:130px"><input class="input sm num" type="number" min="0" step="50" value="${b || ''}" placeholder="—" data-edit="cat" data-id="${c.id}" data-field="budget" data-rerender style="text-align:left"></td>
      <td class="n">${a ? money(a) : '<span class="muted">—</span>'}</td>
      <td class="n ${b && a > b ? 'neg' : ''}">${b ? money(b - a) : '<span class="muted">—</span>'}</td>
      <td style="min-width:140px">${b ? `<div class="track"><div class="fill ${st}" style="width:${Math.min(100, r * 100)}%"></div></div><div class="hint" style="margin-top:3px">${st === 'over' ? `<span class="neg">${ico('alert', 12)} חריגה</span> · ` : st === 'near' ? `<span class="warn">${ico('alert', 12)} קרוב לגבול</span> · ` : ''}${pct(r)}</div>` : ''}</td></tr>`;
  }).join('');
  const rTot = totalB ? totalA / totalB : 0;
  return {html: `<div class="grid kpis">
      ${kpi({label: 'תקציב חודשי', icon: 'pie', value: money(totalB), foot: `${exps.filter(c => +c.budget > 0).length} קטגוריות מתוקצבות`})}
      ${kpi({label: 'הוצאות בפועל', icon: 'trendDown', cls: 'exp', value: money(totalA), foot: totalB ? `<span class="chip ${rTot > 1 ? 'bad' : rTot > dayFrac + .1 ? 'warn' : 'good'}">${pct(rTot)} מהתקציב</span> ${dayFrac > 0 && dayFrac < 1 ? `· עברו ${pct(dayFrac)} מהחודש` : ''}` : 'הגדר תקציב בטבלה'})}
      ${kpi({label: 'נשאר להוציא', icon: 'wallet', value: `<span class="${totalB - totalA < 0 ? 'neg' : ''}">${money(totalB - totalA)}</span>`, foot: dayFrac > 0 && dayFrac < 1 && totalB > totalA ? `≈ ${money((totalB - totalA) / Math.max(1, daysIn(y, m) - NOW.getDate() + 1))} ליום עד סוף החודש` : ''})}
      ${kpi({label: 'חריגות', icon: 'alert', cls: budgetAlerts(y, m).length ? 'exp' : 'inc', value: String(budgetAlerts(y, m).length), foot: budgetAlerts(y, m).length ? 'קטגוריות מעל התקציב' : 'הכול בתוך המסגרת ✓'})}
    </div>
    <div class="panel" style="margin-top:16px"><div class="panel-h"><h3>תקציב מול ביצוע — ${monthLabel(y, m)}</h3><span class="sub">התקציב קבוע לכל חודש · עריכה ישירה בטבלה</span><span class="sp"></span>
      <button class="btn sm" data-act="suggestBudget">${ico('bulb', 14)} הצע תקציב לפי ממוצע 3 חודשים</button></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>קטגוריה</th><th class="n">תקציב</th><th class="n">בפועל</th><th class="n">נשאר</th><th>ניצול</th></tr></thead><tbody>${rows}</tbody>
      <tfoot><tr><td>סה״כ</td><td class="n">${money(totalB)}</td><td class="n">${money(totalA)}</td><td class="n ${totalB - totalA < 0 ? 'neg' : ''}">${money(totalB - totalA)}</td><td></td></tr></tfoot></table></div></div>`};
}

/* ---------- Goals ---------- */
function viewGoals() {
  const card = g => {
    const saved = goalSaved(g), t = +g.target || 0, r = t ? Math.min(1, saved / t) : 0, left = Math.max(0, t - saved);
    let need = '';
    if (g.deadline && left > 0) {
      const [dy, dm] = parseYM(g.deadline), months = Math.max(1, (dy * 12 + dm) - (NOW.getFullYear() * 12 + NOW.getMonth()));
      need = `נדרש ${money(left / months)} בחודש עד ${MONTHS[dm]} ${dy}`;
    }
    return `<div class="panel dcard"><div class="dh"><span class="emo">${esc(g.icon || '🎯')}</span><div style="flex:1;min-width:0"><h3 style="font-size:16px">${esc(g.name)}</h3><div class="hint">${g.deadline ? 'יעד: ' + fmtDate(g.deadline) : 'ללא תאריך יעד'}</div></div>
      <button class="icon-btn" data-act="goalForm" data-id="${g.id}">${ico('edit', 16)}</button><button class="icon-btn del" data-act="delGoal" data-id="${g.id}">${ico('trash', 16)}</button></div>
