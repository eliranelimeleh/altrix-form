      <div class="progress"><div style="width:${r * 100}%"></div></div>
      <div class="prog-meta"><span>${pct(r)} הושלם</span><span>${left ? need : '🎉 היעד הושג!'}</span></div>
      <div style="margin-top:12px"><button class="btn primary sm" data-act="depositGoal" data-id="${g.id}">${ico('plus', 14)} הפקדה</button></div></div>`;
  };
  const tot = sum(db.goals, goalSaved), tgt = sum(db.goals, g => g.target);
  return {html: `<div class="grid kpis">
      ${kpi({label: 'סך נחסך ליעדים', icon: 'piggy', cls: 'inc', value: money(tot), foot: `${db.goals.length} יעדים`})}
      ${kpi({label: 'סך היעדים', icon: 'target', value: money(tgt), foot: tgt ? `${pct(Math.min(1, tot / tgt))} הושלם` : ''})}
    </div>
    <div style="display:flex;margin:18px 0 12px"><h3 style="font-size:16px">היעדים שלי</h3><span class="sp"></span><button class="btn primary" data-act="goalForm">${ico('plus', 16)} יעד חדש</button></div>
    ${db.goals.length ? `<div class="grid cols-2e">${db.goals.map(card).join('')}</div>` : `<div class="panel">${emptyBox('target', 'הגדר יעד — קרן חירום, חופשה, רכב, דירה — ועקוב אחרי ההתקדמות.')}</div>`}
    <div class="hint" style="margin-top:12px">הפקדה ליעד נרשמת גם כתנועה בקטגוריית "חיסכון והשקעות" ויורדת מהעו״ש בתזרים.</div>`};
}

/* ---------- Year ---------- */
function viewYear() {
  const y = ui.y, S = MONTHS.map((_, i) => summary(y, i));
  const incT = sum(S, s => s.inc), expT = sum(S, s => s.exp), savT = sum(S, s => s.sav);
  const active = S.filter(s => s.inc || s.exp).length || 1;
  const rowFor = (c) => {
    const vals = S.map((s, i) => (c.type === 'income' ? incByCat(y, i, c.id) : s.byCat[c.id]) || 0), tot = sum(vals), mx = Math.max(...vals);
    if (!tot) return '';
    return `<tr><td class="sticky">${c.icon} ${esc(c.name)}</td>${vals.map(v => `<td class="n" style="${v && c.type === 'expense' ? `background:color-mix(in srgb,var(--expense) ${Math.round(v / mx * 18)}%,transparent)` : ''}">${v ? nf.format(Math.round(v)) : '<span class="muted">·</span>'}</td>`).join('')}<td class="n"><b>${nf.format(Math.round(tot))}</b></td><td class="n t2">${nf.format(Math.round(tot / active))}</td></tr>`;
  };
  const incRows = db.categories.filter(c => c.type === 'income').map(rowFor).join('');
  const expRows = db.categories.filter(c => c.type === 'expense').map(rowFor).join('');
  const tl = (label, f, cls = '') => `<tr class="total ${cls}"><td class="sticky">${label}</td>${S.map(s => `<td class="n">${f(s)}</td>`).join('')}`;
  const html = `<div class="grid kpis">
      ${kpi({label: `הכנסות ${y}`, icon: 'trendUp', cls: 'inc', value: money(incT), foot: `ממוצע ${money(incT / active)} לחודש`})}
      ${kpi({label: `הוצאות ${y}`, icon: 'trendDown', cls: 'exp', value: money(expT), foot: `ממוצע ${money(expT / active)} לחודש`})}
      ${kpi({label: 'הופרש לחיסכון', icon: 'piggy', value: money(savT), foot: 'קטגוריית חיסכון והשקעות'})}
      ${kpi({label: 'עודף שנתי', icon: 'coins', value: `<span class="${incT - expT < 0 ? 'neg' : ''}">${money(incT - expT)}</span>`, foot: incT ? `שיעור חיסכון ${pct((incT - expT) / incT)}` : ''})}
    </div>
    <div class="panel" style="margin-top:16px"><div class="panel-h"><h3>הכנסות מול הוצאות לפי חודש</h3><span class="sp"></span><div class="legend"><span><i style="background:var(--income)"></i>הכנסות</span><span><i style="background:var(--expense)"></i>הוצאות</span></div></div><div class="chart" id="chY"></div></div>
    <div class="panel" style="margin-top:16px"><div class="panel-h"><h3>דוח שנתי מפורט — ${y}</h3><span class="sub">סכומים ב${cur()} · לפי תאריך העסקה</span><span class="sp"></span><button class="btn sm" data-act="exportYear">${ico('download', 14)} ייצוא ל-Excel (CSV)</button></div>
      <div class="tbl-wrap"><table class="tbl year"><thead><tr><th class="sticky">קטגוריה</th>${SHORT.map(s => `<th class="n">${s}</th>`).join('')}<th class="n">סה״כ</th><th class="n">ממוצע</th></tr></thead><tbody>
        <tr class="sec"><td class="sticky" colspan="15">הכנסות</td></tr>${incRows || '<tr><td colspan="15" class="muted">אין הכנסות</td></tr>'}
        ${tl('סה״כ הכנסות', s => nf.format(Math.round(s.inc)))}<td class="n pos">${nf.format(Math.round(incT))}</td><td class="n">${nf.format(Math.round(incT / active))}</td></tr>
        <tr class="sec"><td class="sticky" colspan="15">הוצאות</td></tr>${expRows || '<tr><td colspan="15" class="muted">אין הוצאות</td></tr>'}
        ${tl('סה״כ הוצאות (ללא חיסכון)', s => nf.format(Math.round(s.exp)))}<td class="n">${nf.format(Math.round(expT))}</td><td class="n">${nf.format(Math.round(expT / active))}</td></tr>
        ${tl('עודף / גירעון', s => `<span class="num ${s.inc - s.exp < 0 ? 'neg' : 'pos'}">${(s.inc - s.exp < 0 ? '−' : '') + nf.format(Math.abs(Math.round(s.inc - s.exp)))}</span>`)}<td class="n"><span class="num">${(incT - expT < 0 ? '−' : '') + nf.format(Math.abs(Math.round(incT - expT)))}</span></td><td></td></tr>
      </tbody></table></div></div>`;
  return {html, after: () => drawYearBars($('#chY'), y)};
}

const VIEWS = {overview: viewOverview, cashflow: viewCashflow, tx: viewTx, cards: viewCards, debts: viewDebts, budget: viewBudget, goals: viewGoals, year: viewYear, settings: viewSettings};

/* ================= MODALS & FORMS ================= */
let onModalClose = null;
function openModal({title, body, submitText = 'שמירה', onSubmit, onMount, wide = false, footExtra = '', danger = false}) {
  const root = $('#modal');
  root.innerHTML = `<div class="modal-backdrop" data-close></div><form class="modal ${wide ? 'wide' : ''}" novalidate>
    <header><h3>${title}</h3><button type="button" class="icon-btn" data-close aria-label="סגירה">${ico('x')}</button></header>
    <div class="modal-body">${body}</div>
    <footer>${footExtra}<span class="sp"></span><button type="button" class="btn ghost" data-close>ביטול</button><button class="btn ${danger ? 'danger' : 'primary'}" type="submit" value="ok">${submitText}</button></footer></form>`;
  root.classList.add('open');
  const form = root.querySelector('form');
  root.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));
  form.addEventListener('submit', e => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(form));
    if (onSubmit(fd, form, e.submitter) !== false) closeModal();
  });
  onMount && onMount(form);
  setTimeout(() => { if (!form.contains(document.activeElement)) (form.querySelector('[autofocus]') || form.querySelector('input:not([type=radio]),select'))?.focus(); }, 60);
}
function closeModal() { $('#modal').classList.remove('open'); $('#modal').innerHTML = ''; }
function confirmBox(text, okText, fn) { openModal({title: 'אישור', body: `<p style="margin:0;font-size:15px">${text}</p>`, submitText: okText, danger: true, onSubmit: () => { fn(); }}); }
function toast(msg) { const t = $('#toast'); t.innerHTML = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2400); }
const fieldErr = (form, name, msg) => { const el = form.querySelector(`[name="${name}"]`); el?.focus(); toast('⚠️ ' + msg); return false; };

function defaultDate() { return ymKey(ui.y, ui.m) === curYM() ? todayISO() : iso(ui.y, ui.m, 1); }
function txForm(t = null, preset = {}) {
  const v = {type: 'expense', date: defaultDate(), amount: '', catId: '', method: 'bank', inst: 1, note: '', debtId: '', ...preset, ...(t || {})};
  if (!v.catId) v.catId = v.type === 'income' ? 'i-salary' : 'c-food';
  const body = `
    <div class="seg" style="margin-bottom:16px">
      <label class="exp"><input type="radio" name="type" value="expense" ${v.type === 'expense' ? 'checked' : ''}><span>${ico('trendDown', 16)} הוצאה</span></label>
      <label class="inc"><input type="radio" name="type" value="income" ${v.type === 'income' ? 'checked' : ''}><span>${ico('trendUp', 16)} הכנסה</span></label></div>
    <div class="form-grid">
      <div class="field full"><label>סכום (${cur()})</label><input class="input amount" name="amount" type="number" inputmode="decimal" step="0.01" min="0" value="${v.amount}" placeholder="0" autofocus required></div>
      <div class="field full"><label>תיאור</label><input class="input" name="note" value="${esc(v.note)}" placeholder="למשל: שופרסל, משכורת אוקטובר, חשמל…" list="noteList" autocomplete="off"></div>
      <div class="field"><label>תאריך</label><input class="input" name="date" type="date" value="${v.date}" required></div>
      <div class="field"><label>קטגוריה</label><select class="input" name="catId">${catOptions(v.type, v.catId)}</select></div>
      <div class="field"><label>אמצעי תשלום</label><select class="input" name="method">${methodOptions(v.method)}</select></div>
      <div class="field" data-show="inst"><label>מספר תשלומים</label><input class="input" name="inst" type="number" min="1" max="60" value="${v.inst || 1}"></div>
      <div class="field full" data-show="debt"><label>שיוך לחוב / הלוואה</label><select class="input" name="debtId"><option value="">— ללא —</option>${db.debts.map(d => `<option value="${d.id}" ${d.id === v.debtId ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select></div>
      <div class="field full" data-show="goal"><label>שיוך ליעד חיסכון</label><select class="input" name="goalId"><option value="">— ללא —</option>${db.goals.map(g => `<option value="${g.id}" ${g.id === v.goalId ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select></div>
      <div class="full hint" id="instHint"></div>
    </div>
    <datalist id="noteList">${[...new Set(db.tx.map(t => t.note).filter(Boolean))].slice(-200).map(n => `<option value="${esc(n)}">`).join('')}</datalist>`;
  openModal({
    title: t ? 'עריכת תנועה' : 'תנועה חדשה', body,
    submitText: t ? 'שמירת שינויים' : 'הוספה',
    footExtra: t ? `<button type="button" class="btn danger" data-act="delTx" data-id="${t.id}">${ico('trash', 15)} מחיקה</button>` : `<button type="submit" class="btn" value="again">שמור והוסף עוד</button>`,
    onMount: form => {
      const F = form.elements;
      const sync = (ev) => {
        const type = form.querySelector('[name=type]:checked').value, cat = F.catId, meth = F.method.value;
        if (ev && ev.target.name === 'type') cat.innerHTML = catOptions(type, type === 'income' ? 'i-salary' : 'c-food');
        const card = isCard(meth) && type === 'expense';
        form.querySelector('[data-show=inst]').style.display = card ? '' : 'none';
        form.querySelector('[data-show=debt]').style.display = cat.value === 'c-debt' && db.debts.length ? '' : 'none';
        form.querySelector('[data-show=goal]').style.display = catById(cat.value).kind === 'saving' && db.goals.length ? '' : 'none';
        const n = +F.inst.value || 1, a = +F.amount.value || 0, c = cardById(meth);
        let h = '';
        if (card && F.date.value) {
          const [yy, mm] = parseYM(F.date.value), [cy2, cm2] = addMonths(yy, mm, 1);
          h = `💳 ${n > 1 ? `${n} תשלומים של ${plain(a / n)} — ` : ''}החיוב הראשון יירד מהעו״ש ב-${Math.min(c.chargeDay, daysIn(cy2, cm2))} ב${MONTHS[cm2]} ${cy2}.`;
        }
        $('#instHint').innerHTML = h;
      };
      form.addEventListener('change', sync); form.addEventListener('input', e => { if (['inst', 'amount'].includes(e.target.name)) sync(); });
      sync();
      // הצעת קטגוריה לפי תיאור שהוזן בעבר
      F.note.addEventListener('change', () => {
        if (t) return;
        const prev = [...db.tx].reverse().find(x => x.note === F.note.value);
        if (prev) { form.querySelector(`[name=type][value=${prev.type}]`).checked = true; F.catId.innerHTML = catOptions(prev.type, prev.catId); F.method.value = prev.method; sync(); }
      });
    },
    onSubmit: (fd, form, submitter) => {
      const amount = Math.abs(parseFloat(fd.amount));
      if (!(amount > 0)) return fieldErr(form, 'amount', 'יש להזין סכום');
      if (!fd.date) return fieldErr(form, 'date', 'יש לבחור תאריך');
      const rec = {
        id: t ? t.id : uid(), ts: t?.ts || Date.now(), type: fd.type, amount: Math.round(amount * 100) / 100, date: fd.date, catId: fd.catId,
        method: fd.method, note: fd.note.trim(), inst: isCard(fd.method) && fd.type === 'expense' ? Math.max(1, Math.round(+fd.inst || 1)) : 1,
      };
      if (fd.catId === 'c-debt' && fd.debtId) rec.debtId = fd.debtId;
      if (catById(fd.catId).kind === 'saving' && fd.goalId) rec.goalId = fd.goalId;
      const keep = t || preset; if (keep.recId) rec.recId = keep.recId;
      if (t) db.tx[db.tx.findIndex(x => x.id === t.id)] = rec; else db.tx.push(rec);
      save(t ? '✓ התנועה עודכנה' : '✓ התנועה נוספה');

    const coll = {cat: db.categories, rec: db.recurring}[el.dataset.edit], o = coll.find(x => x.id === el.dataset.id); if (!o) return;
    o[el.dataset.field] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? (+el.value || 0) : el.value.trim();
    save('✓ נשמר'); if (el.dataset.rerender != null) render(); else EV = null;
    return;
  }
  if (el.dataset.setting) {
    const k = el.dataset.setting; db.settings[k] = el.type === 'number' ? (+el.value || 0) : el.value;
    save('✓ ההגדרה נשמרה'); render();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modal').classList.contains('open')) closeModal();
  if (e.key === 'n' && !e.ctrlKey && !e.metaKey && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && !$('#modal').classList.contains('open')) { e.preventDefault(); txForm(); }
});
$('#importFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.tx) || !Array.isArray(d.categories)) throw new Error('bad');
      confirmBox(`לשחזר מהגיבוי? הוא מכיל ${d.tx.length} תנועות, ${(d.debts || []).length} חובות ו-${(d.cards || []).length} כרטיסים. <b>הנתונים הנוכחיים יוחלפו.</b>`, 'שחזור', () => { db = migrate(d); save('✓ השחזור הושלם'); render(); });
    } catch (err) { toast('⚠️ הקובץ אינו גיבוי תקין'); }
    e.target.value = '';
  };
  r.readAsText(f);
});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (db.settings.theme === 'auto') render(); });

/* ================= DEMO DATA ================= */

  const pick = arr => arr[Math.floor(rnd() * arr.length)];

    {id: 'r7', name: 'הפקדה לקרן חירום', type: 'expense', amount: 1000, catId: 'c-saving', method: 'bank', day: 11, active: true},
    {id: 'r8', name: 'ארנונה', type: 'expense', amount: 540, catId: 'c-bills', method: 'bank', day: 1, active: true},

  ];
  d.goals = [

    {id: 'g2', name: 'חופשה משפחתית', icon: '✈️', target: 12000, initial: 2500, deadline: iso(now.getFullYear() + 1, 7, 1)},

  const B = {'c-food': 2800, 'c-rest': 900, 'c-fuel': 1100, 'c-car': 600, 'c-fun': 800, 'c-cloth': 500, 'c-home': 600, 'c-subs': 150, 'c-bills': 1400, 'c-comm': 200, 'c-ins': 320, 'c-health': 300, 'c-housing': 5400, 'c-gifts': 400, 'c-care': 250};

    add(dd(rr(1, 28)), 'expense', rr(80, 240), 'c-care', 'card-2', pick(['מספרה', 'קוסמטיקה']));

    if (i === 2) add(dd(14), 'expense', 4800, 'c-home', 'card-1', 'טלוויזיה 65 אינץ׳', {inst: 12});
    if (i === 6) add(dd(6), 'expense', 3600, 'c-home', 'card-2', 'מזגן לחדר שינה', {inst: 6});

  d.tx = tx.sort((a, b) => a.date.localeCompare(b.date));
  return d;
}
